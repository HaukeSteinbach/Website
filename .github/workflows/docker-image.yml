name: docker-image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  APP_IMAGE_NAME: ghcr.io/haukesteinbach/haukesteinbach

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Ein Inline-<script> faellt im Betrieb still auf die Nase: der Server
      # schickt eine Content Security Policy mit script-src 'self' und ohne
      # 'unsafe-inline'. Am 07.09. kostete das die ganze Chain-Seite -- sie
      # kam beim Besucher leer an, weil die Einblendung nicht lief und der
      # Inhalt auf opacity:0 stehen blieb. Lokal faellt es nie auf, weil dort
      # keine CSP mitkommt. Also hier, vor dem Bau.
      #
      # Erlaubt bleibt <script type="application/ld+json">: das wird nicht
      # ausgefuehrt, sondern nur gelesen.
      - name: Kein <script> ohne src
        run: |
          treffer=$(grep -nE '<script(?![^>]*(src=|type="application/ld\+json"))' -P *.html || true)
          if [ -n "$treffer" ]; then
            echo "Inline-Skripte gefunden. Die Content Security Policy blockt sie,"
            echo "und die Seite kommt beim Besucher leer an. Nach assets/js/ auslagern:"
            echo "$treffer"
            exit 1
          fi
          echo "Keine Inline-Skripte."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.APP_IMAGE_NAME }}:latest
            ${{ env.APP_IMAGE_NAME }}:${{ github.sha }}