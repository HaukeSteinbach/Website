server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /release-artwork/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/listen-to-[a-z0-9-]+$ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Die Productions-Seite ist entfallen; ihre Inhalte stehen auf der
    # Startseite unter "Featured work". Dauerhafte Weiterleitung, damit
    # bestehende Links und Suchtreffer nicht ins Leere laufen.
    location = /productions.html {
        return 301 /#work;
    }

    # Steinbach EQ heiszt seit dem 07.09.2026 Steinbach Chain. Die alte
    # Produktseite ist geloescht, nicht ersetzt: der alte Name soll auf der
    # Website nirgends mehr auftauchen.
    #
    # DIESE ZEILE IST DER EINZIGE ORT, DER IHN NOCH KENNT, und sie ist der
    # Grund, warum das Loeschen keinen Schaden anrichtet. Ohne sie liefe alles
    # ins Leere, was auf die alte Adresse zeigt, und davon gibt es reichlich:
    #
    #   · Suchmaschineneintraege. "steinbach-eq.html" ist seit August 2026
    #     indexiert. Ohne Weiterleitung liefert der Treffer eine 404, und der
    #     Sucher schlieszt daraus, das Produkt sei eingestellt. Mit der 301
    #     wandert die gesammelte Bewertung auf die neue Adresse.
    #   · Lesezeichen und Links aus Foren, Mails und Patreon-Beitraegen.
    #   · Die vierzehn Seiten der Website selbst verwiesen bis heute hierher.
    #
    # 301 und nicht 302: die Verschiebung ist dauerhaft, und nur die dauerhafte
    # Meldung veranlasst Suchmaschinen, den Eintrag wirklich umzuschreiben.
    location = /steinbach-eq.html {
        return 301 /steinbach-chain.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}