<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>UI Studio · Steinbach Audio</title>
<!--
  Steinbach UI Studio — Fassung fuer Steinbach Audio (haukesteinbach.de).

  Diese Datei liegt NICHT im ausgelieferten Teil der Website. Die Quelle steht
  im Website-Repo unter tools/uistudio/, veroeffentlicht wird sie mit
  tools-publish-uistudio.sh in den privaten Supabase-Storage
  (installers/_docs/uistudio-audio.html). Von dort holt uistudio.html sie ueber
  die Edge Function cockpit-content?doc=uistudio-audio — nur fuer Konten in
  UISTUDIO_AUDIO_ALLOWED.

  Unterschiede zur Instruments-Fassung:
    - keine Roever-Vorlage (954 KB, gehoert zu den Kontakt-Instrumenten)
    - Team-Speicher im Bereich 'audio', siehe CLOUD_SCOPE weiter unten
    - Anmeldung aus /assets/js/ads/ statt /assets/js/

  Beim Aendern: den Baustand-Aufkleber oben mitziehen. Steht dort ein alter
  Wert, laeuft eine alte Kopie — das hat schon einmal einen halben Tag gekostet.
-->
<style>
:root{
  --bg:#17191d; --panel:#20232a; --panel2:#1b1e24; --line:#31353e;
  --text:#d9dce2; --dim:#8d929c; --acc:#4da3ff; --danger:#e05b5b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:var(--text);background:#2b2f38;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:#343945}
button.primary{background:var(--acc);border-color:var(--acc);color:#08121f;font-weight:600}
button.primary:hover{filter:brightness(1.1)}
button.mini{padding:2px 7px;font-size:12px}
button.danger{color:#ffb3b3;border-color:#5a3333}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px 6px;user-select:text;-webkit-user-select:text}
input[type=number]{width:62px}
input[type=color]{padding:1px;width:34px;height:24px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--acc);border-color:var(--acc)}
label{color:var(--dim)}

/* ---------- Toolbar ---------- */
#toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#toolbar .brand{font-weight:700;letter-spacing:.02em;margin-right:4px}
#toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
#kFit{font:11px/1 ui-monospace,monospace;letter-spacing:.03em;padding:4px 8px;border-radius:5px;
  border:1px solid var(--line);color:var(--dim);white-space:nowrap}
#kFit.gut{color:#7fb98a;border-color:#3c5a44}
#kFit.schlecht{color:#e2a33c;border-color:#5c4a26;background:#2a2116}
#modeSwitch,#kviewSwitch{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
#kviewSwitch button{border:none;border-radius:0;background:transparent;padding:4px 10px;font-size:12px}
#kviewSwitch button.on{background:#3d434f;color:#fff;font-weight:600}
#modeSwitch button{border:none;border-radius:0;background:transparent;padding:4px 12px}
#modeSwitch button.on{background:var(--acc);color:#08121f;font-weight:600}
#projName{width:150px}

/* ---------- Layout ---------- */
#main{flex:1;display:flex;min-height:0}
.panel{width:230px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#rightPanel{border-right:none;border-left:1px solid var(--line);width:260px}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:8px 10px 4px}
.panel .scroll{overflow-y:auto;flex:1;padding:0 8px 8px}

/* Assets */
#dropZone{margin:4px 8px;border:1.5px dashed var(--line);border-radius:8px;padding:12px 8px;text-align:center;color:var(--dim);cursor:pointer;font-size:12px}
#dropZone.hot{border-color:var(--acc);color:var(--acc);background:rgba(77,163,255,.06)}
.assetItem{display:flex;align-items:center;gap:8px;padding:4px;border-radius:6px;margin-bottom:2px}
.assetItem:hover{background:var(--panel2)}
.assetItem img{width:34px;height:34px;object-fit:contain;background:
  repeating-conic-gradient(#2a2d34 0 25%,#22252b 0 50%) 0 0/12px 12px;border-radius:4px;flex:none}
.assetItem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.assetItem.isBg .nm::after{content:" · BG";color:var(--acc)}
/* Layers */
.layerItem{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:12px}
.layerItem:hover{background:var(--panel2)}
.layerItem.sel{background:rgba(77,163,255,.15);color:#fff}
.layerItem .tag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 4px;flex:none}

/* Inspector */
#insp .row{display:flex;align-items:center;gap:6px;margin:5px 0}
#insp .row>label{width:82px;flex:none;font-size:12px}
#insp .row input[type=text],#insp .row select,#insp .row textarea{flex:1;min-width:0}
#insp .group{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
#insp .btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
#insp .empty{color:var(--dim);padding:16px 8px;font-size:12px}

/* ---------- Stage ---------- */
#stageWrap{flex:1;overflow:auto;background:#101114;position:relative}
#stageBox{margin:40px;position:relative}
/* Der Streifen, den Kontakt mit seiner eigenen Leiste (Name, Output, MIDI)
   verdeckt. Er gehoert zum Wallpaper, ist im Plugin aber nie zu sehen. */
#kHead{position:absolute;left:0;transform-origin:0 100%;background-repeat:no-repeat;
  box-shadow:inset 0 0 0 1px var(--line);display:none;overflow:hidden}
#kHead::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(
  135deg,rgba(0,0,0,.62) 0 8px,rgba(0,0,0,.48) 8px 16px)}
/* In der Kontakt-Ansicht steht dort Kontakts eigene Kopfleiste, nicht das
   verdeckte Wallpaper - so sieht man die Flaeche wie im Plugin. */
#kHead.kontakt{background-image:none!important;box-shadow:none}
#kHead.kontakt::after{display:none}
#kHead.kontakt span{display:none}
#kHead .kmock{position:absolute;inset:0;display:none;background:#3c3c3c;
  font:11px/1 -apple-system,"Segoe UI",Roboto,sans-serif;color:#d6d6d6;overflow:hidden}
#kHead.kontakt .kmock{display:block}
#kHead .kmock .krow{position:absolute;left:34px;right:0;background:#4a4a4a;
  border-bottom:1px solid #333;display:flex;align-items:center;gap:8px;padding:0 8px}
#kHead .kmock .kname{font-weight:600;color:#fff}
#kHead .kmock .kwrench{position:absolute;left:0;top:0;bottom:0;width:34px;
  background:#2e2e2e;border-right:1px solid #222}
#kHead .kmock .kdim{color:#9a9a9a}
#kHead span{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:1;
  font:600 11px/1 ui-monospace,monospace;letter-spacing:.14em;color:#c8cdd6;
  text-shadow:0 1px 3px #000;pointer-events:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:#000;box-shadow:0 0 0 1px var(--line),0 12px 40px rgba(0,0,0,.6);background-repeat:no-repeat}
#stage.checker{background-color:#26292f;background-image:repeating-conic-gradient(#2c2f36 0 25%,#26292f 0 50%);background-size:24px 24px}
#stage.gridOn::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:var(--gs) var(--gs)}
.el{position:absolute;background-repeat:no-repeat}
.el.edit{cursor:move}
.el.edit:hover{outline:1px dashed rgba(77,163,255,.55)}
.el.sel{outline:1.5px solid var(--acc) !important}
.el.test.grab{cursor:ns-resize}
.el .rs{position:absolute;right:-6px;bottom:-6px;width:11px;height:11px;background:var(--acc);border:1.5px solid #fff;border-radius:2px;cursor:nwse-resize}
.el .rot{position:absolute;inset:0;background-repeat:no-repeat;background-size:100% 100%}
.el .lbl{width:100%;height:100%;display:flex;align-items:center;white-space:pre-wrap}
/* Platzhalter-Optik solange keine Grafik zugewiesen ist */
.ph-knob{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5a5f6a,#2b2e35 70%);box-shadow:inset 0 0 0 2px #14161a,0 2px 5px rgba(0,0,0,.5)}
.ph-knob .pin{position:absolute;left:calc(50% - 1.5px);top:6%;width:3px;height:38%;background:#e8eaee;border-radius:2px;transform-origin:50% calc(44% / .38 * .5)}
.ph-knob .pinwrap{position:absolute;inset:0}
.ph-track{position:absolute;background:#14161a;border-radius:4px;box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
.ph-handle{position:absolute;background:linear-gradient(#6a707c,#3a3e47);border-radius:3px;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.ph-btn{position:absolute;inset:0;border-radius:6px;background:linear-gradient(#3a3e47,#24272d);box-shadow:inset 0 0 0 1.5px #14161a}
.ph-btn.on{background:linear-gradient(#4da3ff,#2f6db3);box-shadow:inset 0 0 0 1.5px #14161a,0 0 12px rgba(77,163,255,.5)}
.ph-img{position:absolute;inset:0;border:1.5px dashed #4a4f5a;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#4a4f5a;font-size:11px}
.ph-link{position:absolute;inset:0;border:1.5px dashed #4da3ff;background:rgba(77,163,255,.14);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#9cc9ff;font-size:10px;overflow:hidden;white-space:nowrap}
.el.test .ph-link{opacity:0}
/* Button ohne Grafik = unsichtbare Trefferflaeche (wie in Kontakt). Beim
   Bearbeiten durchscheinend, beim Testen nur ein feiner Umriss - sonst
   verdeckt die Platte das Bild darunter. */
.ph-btn{opacity:.45}
.el.test .ph-btn{background:none;box-shadow:none;opacity:1;
  border:1px dashed rgba(255,255,255,.22)}
.el.test .ph-btn.on{border-color:rgba(77,163,255,.55)}
.el.test.t-link{cursor:pointer}

/* ---------- Statusbar ---------- */
#status{display:flex;gap:16px;padding:5px 12px;background:var(--panel);border-top:1px solid var(--line);color:var(--dim);font-size:12px}
#status .right{margin-left:auto;color:var(--text)}

/* ---------- Modal ---------- */
#modalBack{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
#modalBack.open{display:flex}
#modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(720px,92vw);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modal header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
#modal header button{margin-left:auto}
#modalBody{padding:14px 16px;overflow-y:auto}
#modalBody textarea{width:100%;height:320px;font:11px/1.5 ui-monospace,Menlo,monospace;white-space:pre;resize:vertical}
#modalBody .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#modalBody h4{margin:12px 0 4px}
#modalBody p,#modalBody li{color:var(--text);font-size:13px;margin-bottom:6px}
#modalBody ul{padding-left:18px}
#modalBody kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px}
</style>
</head>

  <span class="brand">Steinbach UI Studio · Audio</span><span class="tag" id="buildTag" title="Baustand dieser Datei — bei Problemen zuerst vergleichen">2026-08-25 · Audio</span>

<script>
'use strict';
/* ============================== State ============================== */
const $ = s => document.querySelector(s);
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const deep = o => JSON.parse(JSON.stringify(o));
let elCounter = 1, assetCounter = 1;

function newProject(){
  return { name:'Mein Plugin', win:{w:1000,h:560}, bg:null, assets:{}, elements:[], groups:[] };
}

/* Standard-Reihenfolge der Button-States, je nach Anzahl der Bilder.
   Frame 0 ist immer der Ruhezustand — daran haelt sich auch der Export. */
const STATE_PRESETS = {
  2: ['Aus','An'],
  3: ['Aus','Halb','An'],
  4: ['Aus','An','Aus · Hover','An · Hover'],
  5: ['Aus','Halb','An','Hover','Gedrückt'],
  6: ['Aus','An','Aus · Hover','An · Hover','Aus · Gedrückt','An · Gedrückt'],
};
function defaultStates(n){
  if(STATE_PRESETS[n]) return STATE_PRESETS[n].slice();
  return Array.from({length:n}, (_,i)=> i===0 ? 'Aus' : (i===n-1 ? 'An' : 'Zwischen '+i));
}
let project = newProject();
let sel = null;              // ausgewählte Element-ID
let mode = 'edit';           // 'edit' | 'test'
let zoom = 1;
let grid = {on:false, size:8};
let undoStack = [], redoStack = [];

const byId = id => project.elements.find(e=>e.id===id);
const selEl = () => sel ? byId(sel) : null;

/* ============================== History ============================== */
function pushHistory(){
  undoStack.push(JSON.stringify(project));
  if(undoStack.length>60) undoStack.shift();
  redoStack.length = 0;
  autosave();
}
/* Rueckgaengig ist PERSOENLICH.

   Frueher setzte es schlicht `project` auf einen alten Schnappschuss zurueck.
   Allein ist das richtig. Zu zweit loescht es die Arbeit des anderen mit: der
   Schnappschuss stammt aus einer Zeit, in der dessen letzte zehn Minuten noch
   nicht passiert waren, und mit ihm wandern sie weg.

   Deshalb wird der Schnappschuss nicht mehr aufgelegt, sondern eingemischt —
   ohne die Felder, die seither von der anderen Seite kamen (liveFremdFelder).
   Ist niemand sonst da, ist diese Menge leer und es verhaelt sich exakt wie
   vorher. */
function zurueckMischen(schnappschuss){
  const alt = JSON.parse(schnappschuss);
  const fremd = (typeof liveFremdFelder !== 'undefined') ? liveFremdFelder : new Set();

  if(!fremd.size){ project = alt; return; }

  ['name','bg','bgTop','win'].forEach(k => {
    if(!fremd.has('kopf|' + k)) project[k] = alt[k];
  });

  ['elements','groups'].forEach(feld => {
    const jetzt = new Map((project[feld]||[]).map(e => [e.id, e]));
    const damals = new Map((alt[feld]||[]).map(e => [e.id, e]));
    const ergebnis = [];

    (alt[feld]||[]).forEach(damalsE => {
      const jetztE = jetzt.get(damalsE.id);
      if(!jetztE){ ergebnis.push(damalsE); return; }   // ich hatte es geloescht
      const zusammen = {};
      new Set([...Object.keys(damalsE), ...Object.keys(jetztE)]).forEach(k => {
        zusammen[k] = fremd.has(damalsE.id + '|' + k) ? jetztE[k] : damalsE[k];
      });
      // Felder, die es damals nicht gab und die nicht von aussen kamen, fallen weg
      Object.keys(zusammen).forEach(k => { if(zusammen[k] === undefined) delete zusammen[k]; });
      ergebnis.push(zusammen);
    });

    /* Was der andere waehrenddessen angelegt hat, gab es im Schnappschuss
       nicht — es bleibt trotzdem stehen. */
    jetzt.forEach((e, id) => { if(!damals.has(id) && fremd.has(id + '|__neu')) ergebnis.push(e); });

    project[feld] = ergebnis;
  });

  /* Grafiken sind additiv und gehen nie ueber die Leitung; sie zurueckzurollen
     wuerde nur fremde Bilder unerreichbar machen. */
  project.assets = Object.assign({}, alt.assets, project.assets);
}

function undo(){
  if(!undoStack.length) return;
  redoStack.push(JSON.stringify(project));
  zurueckMischen(undoStack.pop());
  maskenCacheLeeren();
  if(sel && !byId(sel)) sel = null;
  renderAll(); autosave();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(JSON.stringify(project));
  zurueckMischen(redoStack.pop());
  maskenCacheLeeren();
  if(sel && !byId(sel)) sel = null;
  renderAll(); autosave();
}
function autosave(){
  try{ localStorage.setItem('sus_autosave', JSON.stringify(project)); }catch(e){/* zu groß – egal */}
  /* Derselbe Aufruf traegt die Aenderung zum anderen. Absichtlich hier und
     nicht an den dreissig Stellen, die autosave() rufen: was der oertliche
     Speicher mitbekommt, bekommt die Runde auch mit. Siehe „Gemeinsam
     arbeiten" weiter unten. */
  if(typeof liveAbgleich === 'function') liveAbgleich();
}

/* ============================== Elemente ============================== */
const TYPE_NAMES = {knob:'Knob', fader:'Fader', button:'Button', label:'Text', image:'Bild', link:'Link'};

/* ============================== Icons ==============================
   Schlanke Inline-SVGs statt Emoji: gleiche Strichstaerke, faerben sich
   ueber currentColor mit der Oberflaeche mit und sehen auf jedem System
   identisch aus. */
const ICONS = {
  eye:      '<path d="M1 8s2.5-4.5 7-4.5S15 8 15 8s-2.5 4.5-7 4.5S1 8 1 8Z"/><circle cx="8" cy="8" r="2"/>',

function icon(name, size){
  const sz = size || 14;
  return '<svg viewBox="0 0 16 16" width="' + sz + '" height="' + sz + '" fill="none" '
    + 'stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" '
    + 'aria-hidden="true" style="display:block;">' + (ICONS[name] || '') + '</svg>';
}
/** Knopf mit Icon (und optionalem Text) — ersetzt die frueheren Emoji-Knoepfe. */
function iconBtn(name, title, label){
  const b = document.createElement('button');
  b.className = 'mini';
  b.title = title || '';
  b.innerHTML = icon(name) + (label ? '<span style="margin-left:5px;">' + esc(label) + '</span>' : '');
  b.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;';
  return b;
}


function addElement(type){
  pushHistory();
  const w = project.win.w, h = project.win.h;
  const base = { id:'el_'+(elCounter++), type, name:TYPE_NAMES[type]+' '+elCounter, paramId:'',
                 x:Math.round(w/2-30), y:Math.round(h/2-30), w:60, h:60, value:0.7,
                 groupId:null, hidden:false, locked:false, alphaHit:true };
  if(type==='knob') Object.assign(base,{render:'auto', asset:null, frames:31, gridCols:1, startDeg:-135, sweep:270, steps:0});
  if(type==='fader') Object.assign(base,{render:'auto', orient:'v', asset:null, frames:31, gridCols:1,
                 handleAsset:null, hw:28, hh:16, w:36, h:160, x:Math.round(w/2-18), y:Math.round(h/2-80)});
  if(type==='button') Object.assign(base,{asset:null, frames:2, value:0, w:56, h:28, toggle:'cycle',
                 states:defaultStates(2), drives:[]});
  if(type==='label') Object.assign(base,{text:'TEXT', font:'Helvetica Neue', size:14, weight:'500', color:'#e8eaee',
                 spacing:1, align:'center', w:120, h:24});
  /* Bilder koennen selbst Sprites sein: so schaltet ein Button den Backdrop
     (Orgelschluessel, Philicorda-Licht) einfach auf einen anderen Frame um. */
  if(type==='image') Object.assign(base,{asset:null, w:120, h:120, frames:1, gridCols:1, states:['Standard']});
  if(type==='link') Object.assign(base,{url:'https://steinbach-instruments.de', w:120, h:40});
  project.elements.push(base);
  sel = base.id;
  renderAll();
}
function deleteSel(){
  if(!sel) return;
  pushHistory();
  project.elements = project.elements.filter(e=>e.id!==sel);
  sel = null; renderAll();
}
function duplicateSel(dx=16, dy=16, silent=false){
  const e = selEl(); if(!e) return null;
  if(!silent) pushHistory();
  const c = deep(e); c.id = 'el_'+(elCounter++); c.name = e.name+' Kopie';
  c.x += dx; c.y += dy;
  project.elements.push(c);
  sel = c.id;
  if(!silent) renderAll();
  return c;
}
function rowDuplicate(){
  const e = selEl(); if(!e) return;
  const n  = parseInt(prompt('Wie viele Kopien?', '5')||'0',10);
  if(!n||n<1) return;
  const dx = parseFloat(prompt('Abstand X (px)', '62')||'0');
  const dy = parseFloat(prompt('Abstand Y (px)', '0')||'0');
  pushHistory();
  let last = e;
  for(let i=1;i<=n;i++){
    const c = deep(e); c.id='el_'+(elCounter++); c.name=e.name+' '+(i+1);
    c.x = Math.round(e.x+dx*i); c.y = Math.round(e.y+dy*i);
    project.elements.push(c); last=c;
  }
  sel = last.id; renderAll();
}
function moveZ(dir){
  const i = project.elements.findIndex(e=>e.id===sel);
  if(i<0) return;
  const j = i+dir;
  if(j<0||j>=project.elements.length) return;
  pushHistory();
  const [e] = project.elements.splice(i,1);
  project.elements.splice(j,0,e);
  renderAll();
}

/* ============================== Rendering ============================== */
function renderAll(){ renderStage(); renderLayers(); renderAssets(); renderInspector(); syncToolbar(); maskenVorwaermen(); }

/* Die Trefferpruefung faellt auf das Rechteck zurueck, solange ein Sprite
   noch nicht dekodiert ist. Ohne Vorwaermen traefe deshalb ausgerechnet
   der erste Klick auf jede Taste daneben. */
function maskenVorwaermen(){
  for(const el of project.elements){
    if(el.asset && el.alphaHit !== false) alphaBild(el.asset);
  }
}

function syncToolbar(){
  $('#projName').value = project.name;
  $('#winW').value = project.win.w;
  $('#winH').value = project.win.h;
  /* Die Rechnung steht dauerhaft in der Werkzeugleiste, nicht nur im
     Inspektor - sie ist der Punkt, an dem es schiefgehen kann. */
  const fit = $('#kFit'), zelle = tafelZellenhoehe();
  if(!project.bgTop){ fit.className=''; fit.textContent = zelle ? 'ohne Kopfzeile' : ''; }
  else if(zelle === null){ fit.className=''; fit.textContent = 'Kopfzeile ' + project.bgTop + ' · keine Tafel'; }
  else if(Math.abs(zelle - (project.win.h + project.bgTop)) < 0.51){
    fit.className='gut';
    fit.textContent = 'Tafel ' + Math.round(zelle) + ' = ' + project.bgTop + ' + ' + project.win.h;
  }else{
    fit.className='schlecht';
    fit.textContent = 'Tafel ' + Math.round(zelle) + ' ≠ ' + project.bgTop + ' + ' + project.win.h;
  }
}

function renderStage(){
  const st = $('#stage');
  const w = project.win.w, h = project.win.h;
  st.style.width = w+'px'; st.style.height = h+'px';
  st.style.transform = 'scale('+zoom+')';
  $('#stageBox').style.width  = (w*zoom)+'px';
  $('#stageBox').style.height = (h*zoom)+'px';
  /* Platz fuer das Kopfzeilenband ueber der Buehne, sonst schiebt es sich
     unter die Werkzeugleiste. */
  $('#stageBox').style.marginTop = (40 + Math.max(0, project.bgTop|0) * zoom) + 'px';
  const bg = project.bg && project.assets[project.bg];
  st.classList.toggle('checker', !bg);
  st.style.backgroundImage = bg ? 'url('+bg.dataUrl+')' : '';
  /* Hintergrund kann selbst ein Sprite sein: ein Bogen mit mehreren Zustaenden,
     von dem immer ein Ausschnitt zu sehen ist — genau wie Kontakt es macht.
     Ein Button kann den Ausschnitt umschalten (Orgelschluessel, Lampe …). */
  const bgN = Math.max(1, project.bgFrames|0 || 1);
  /* Kontakt legt oben seine eigene Leiste (Name, Output, MIDI) ueber die
     Tafel. Diese Zeilen gehoeren zum Bild, sind im Plugin aber nie zu sehen.
     bgTop schneidet sie weg: eine Zustandszelle ist h+bgTop hoch, gezeigt
     wird der Teil darunter. So bleiben die Elementkoordinaten genau die
     move_control_px-Werte aus dem KSP. */
  const bgTop = Math.max(0, project.bgTop|0);
  const cellH = h + bgTop;
  if(bg && bgN > 1){
    const cols = Math.max(1, project.bgCols|0 || 1);
    const rows = Math.ceil(bgN / cols);
    const idx  = Math.min(Math.max(0, project.bgValue|0), bgN-1);
    const c = idx % cols, r = Math.floor(idx / cols);
    st.style.backgroundSize = (w*cols)+'px '+(cellH*rows)+'px';
    st.style.backgroundPosition = (-c*w)+'px '+(-(r*cellH + bgTop))+'px';
    st.style.backgroundRepeat = 'no-repeat';
  }else if(bg && bgTop > 0){
    st.style.backgroundSize = w+'px '+cellH+'px';
    st.style.backgroundPosition = '0 '+(-bgTop)+'px';
    st.style.backgroundRepeat = 'no-repeat';
  }else{
    st.style.backgroundSize = bg ? '100% 100%' : '';
    st.style.backgroundPosition = '0 0';
  }
  /* Kopfzeilenband: zeigt genau die Wallpaper-Zeilen, die Kontakt verdeckt,
     damit man beim Entwerfen sieht, was oben verlorengeht. */
  const kh = $('#kHead');
  if(bg && bgTop > 0){
    const cols = Math.max(1, project.bgCols|0 || 1);
    const idx  = Math.min(Math.max(0, project.bgValue|0), bgN-1);
    const c = idx % cols, r = Math.floor(idx / cols);
    const rows = Math.ceil(bgN / cols);
    kh.style.display = 'block';
    kh.style.width  = w+'px';
    kh.style.height = bgTop+'px';
    kh.style.transform = 'scale('+zoom+')';
    kh.style.top = (-bgTop*zoom)+'px';
    kh.style.backgroundImage = 'url('+bg.dataUrl+')';
    kh.style.backgroundSize = (w*cols)+'px '+(cellH*rows)+'px';
    kh.style.backgroundPosition = (-c*w)+'px '+(-r*cellH)+'px';
    kh.querySelector('span').textContent = 'KONTAKT-KOPFZEILE · ' + bgTop + ' px — verdeckt';
    kh.classList.toggle('kontakt', kview === 'kontakt');
    if(kview === 'kontakt') zeichneKontaktKopf(kh.querySelector('.kmock'), bgTop);
  }else{
    kh.style.display = 'none';
  }
  st.classList.toggle('gridOn', grid.on && mode==='edit');
  st.style.setProperty('--gs', grid.size+'px');
  st.innerHTML = '';
  const bgNow = Math.min(Math.max(0, project.bgValue|0), bgN-1);
  for(const el of project.elements){
    if(el.hidden) continue;               // im Layer-Stack ausgeblendet
    /* An eine Ansicht gebunden: leer = immer sichtbar (z. B. die Fussleiste),
       sonst nur in den aufgezaehlten Hintergrundzustaenden — wie Kontakt
       Bedienelemente pro Seite ein- und ausblendet. */
    if(Array.isArray(el.showOnBg) && el.showOnBg.length
       && !el.showOnBg.includes(bgNow) && el.id!==sel) continue;   // markiertes bleibt greifbar
    st.appendChild(elementNode(el));
  }
  updateStatus();
}

function elementNode(el){
  const d = document.createElement('div');
  d.className = 'el t-'+el.type+' '+(mode==='edit'?'edit':'test')+(el.id===sel?' sel':'');
  if(mode==='test'&&(el.type==='knob'||el.type==='fader')) d.classList.add('grab');
  d.dataset.id = el.id;
  d.style.left = el.x+'px'; d.style.top = el.y+'px';
  d.style.width = el.w+'px'; d.style.height = el.h+'px';
  renderContent(d, el);
  if(mode==='edit' && el.id===sel){
    const rs = document.createElement('div'); rs.className='rs'; d.appendChild(rs);
  }
  return d;
}
function updateNode(el){
  const d = $('#stage').querySelector('.el[data-id="'+el.id+'"]');
  if(!d){ renderStage(); return; }
  d.style.left=el.x+'px'; d.style.top=el.y+'px'; d.style.width=el.w+'px'; d.style.height=el.h+'px';
  const rs = d.querySelector('.rs');
  d.innerHTML=''; renderContent(d, el);
  if(rs) d.appendChild(rs);
  updateStatus();
}

function applyStrip(node, asset, frames, cols, idx, w, h){
  frames = Math.max(1, frames|0); cols = Math.max(1, cols|0);
  const rows = Math.ceil(frames/cols);
  idx = clamp(idx|0, 0, frames-1);
  node.style.backgroundImage = 'url('+asset.dataUrl+')';
  node.style.backgroundSize = (cols*w)+'px '+(rows*h)+'px';
  const c = idx%cols, r = Math.floor(idx/cols);
  node.style.backgroundPosition = (-c*w)+'px '+(-r*h)+'px';
}
const snapSteps = (v,steps)=> steps>=2 ? Math.round(v*(steps-1))/(steps-1) : v;

/** Button-Zustand auf gekoppelte Bild-Elemente uebertragen. */
/* ---------------------------------------------------------------
   Animation. Ein Element mit mehr als zwei Frames laeuft im Test-
   Modus durch seine Zwischenstufen, statt zu springen — die Taste
   kippt also sichtbar. Alles, was im Test einen Wert setzt, geht
   durch setzeWert(); damit animiert auch, was ueber 'drives'
   mitgezogen wird, und spaetere Animationen erben das von selbst.
   --------------------------------------------------------------- */
const ANIM_STD = 70;            // ms fuer den ganzen Weg, wenn nichts gesetzt ist
const laufend = new Map();      // el.id -> {von, ziel, t0, ms}
let tickerAn = false;

function animDauer(el){
  /* Ohne ausdrueckliche Angabe wird nicht animiert: Bestandsprojekte
     sollen sich genau wie vorher verhalten. ANIM_STD ist nur der
     Vorschlagswert fuer neu gebaute Pakete. */
  const v = (el.animMs===undefined || el.animMs===null) ? 0 : (el.animMs|0);
  return Math.max(0, v);
}

function setzeWert(el, ziel, sofort){
  const max = Math.max(2, el.frames|0) - 1;
  ziel = Math.min(max, Math.max(0, ziel|0));
  const ms = sofort ? 0 : animDauer(el);
  const von = el.value|0;
  if(ms <= 0 || max < 2 || von === ziel){
    const a0 = laufend.get(el.id);
    if(a0 && !sofort && a0.ziel !== ziel){ a0.danach = ziel; return; }
    laufend.delete(el.id);
    el.value = ziel; updateNode(el); applyDrives(el);
    return;
  }
  /* Laeuft noch ein Anschlag, wird er zu Ende gefuehrt und das neue Ziel
     danach angesteuert. Ein kurzes Antippen zeigt so den vollen Weg —
     eine echte Taste federt auch erst zurueck, wenn sie unten war. */
  const a = laufend.get(el.id);
  if(a && a.ziel !== ziel){ a.danach = ziel; return; }
  // Teilweg kostet nur seinen Anteil der Zeit — ein Antippen federt schnell zurueck.
  const anteil = Math.abs(ziel - von) / max;
  laufend.set(el.id, {von, ziel, t0: performance.now(), ms: Math.max(16, ms*anteil)});
  starteTicker();
}

/* Logischer Zustand: waehrend einer Animation ist el.value der gerade
   sichtbare Frame, nicht der Zustand. Geschaltet wird ab dem Ziel. */
function zielWert(el){
  const a = laufend.get(el.id);
  if(!a) return el.value|0;
  return a.danach !== undefined ? a.danach : a.ziel;
}

function starteTicker(){
  if(tickerAn) return;
  tickerAn = true;
  /* Waechter: requestAnimationFrame ruht, sobald das Fenster in den
     Hintergrund geht. Ohne ihn bliebe eine Taste auf halbem Weg stehen.
     Der Waechter setzt jede ueberfaellige Animation auf ihren Endwert. */
  const waechter = setInterval(()=>{
    const jetzt = performance.now();
    for(const [id, a] of Array.from(laufend)){
      if(laufend.get(id) !== a) continue;
      if(jetzt - a.t0 < a.ms + 250) continue;
      const el = byId(id);
      if(el){ el.value = a.ziel; updateNode(el); applyDrives(el); }
      laufend.delete(id);
      if(el && a.danach !== undefined && a.danach !== a.ziel) setzeWert(el, a.danach);
    }
    if(!laufend.size){ clearInterval(waechter); tickerAn = false; }
  }, 250);
  requestAnimationFrame(function schritt(jetzt){
    for(const [id, a] of Array.from(laufend)){
      // In diesem Durchlauf ersetzt (applyDrives) — der naechste Frame nimmt
      // den neuen Eintrag. Ohne diese Wache loescht der alte Snapshot ihn.
      if(laufend.get(id) !== a) continue;
      const el = byId(id);
      if(!el){ laufend.delete(id); continue; }
      const p = a.ms<=0 ? 1 : Math.min(1, (jetzt - a.t0)/a.ms);
      const v = Math.round(a.von + (a.ziel - a.von)*p);
      if(v !== (el.value|0)){ el.value = v; updateNode(el); applyDrives(el); }
      if(p >= 1){
        el.value = a.ziel; updateNode(el); applyDrives(el);
        laufend.delete(id);
        if(a.danach !== undefined && a.danach !== a.ziel) setzeWert(el, a.danach);
      }
    }
    if(laufend.size) requestAnimationFrame(schritt);
    else { clearInterval(waechter); tickerAn = false; }
  });
}

/* Was sich im Test wie eine Taste verhaelt: ein Button auf 'momentary'
   — oder ein Bild-Sprite, das direkt gedrueckt werden kann. Dieselbe
   Bedingung wie im pointerdown-Zweig, sonst faende die Rechnertastatur
   eine Klaviatur aus Bild-Elementen ueberhaupt nicht. */
function istTaste(el){
  if(el.toggle === 'momentary') return true;
  return el.type === 'image' && (el.frames|0) > 1 && !wirdGetrieben(el.id);
}

/* Wird dieses Element von einem anderen ueber 'drives' geschaltet? */
function wirdGetrieben(id){
  for(const e of project.elements){
    if(!Array.isArray(e.drives)) continue;
    for(const d of e.drives) if(d.target === id) return true;
  }
  return false;
}

/* Kontakts Instrumentenkopf, masstabsgetreu nachgebaut: Titelzeile 26 px,
   darunter zwei Zeilen zu je 21 - zusammen die 68 px, die das Wallpaper
   verdecken. Nur Kulisse, damit der Entwurf im Plugin-Zusammenhang steht. */
function zeichneKontaktKopf(box, h){
  const t = Math.round(h * 26/68), z = Math.round(h * 21/68);
  box.innerHTML =
    '<div class="kwrench"></div>' +
    '<div class="krow" style="top:0;height:'+t+'px"><span class="kdim">▾</span>' +
      '<span class="kname">' + (project.name || 'Instrument') + '</span></div>' +
    '<div class="krow" style="top:'+t+'px;height:'+z+'px">' +
      '<span class="kdim">Output:</span><span>Out 1</span>' +
      '<span style="flex:1"></span><span class="kdim">Voices:</span><span>0</span>' +
      '<span class="kdim">Max:</span><span>1024</span></div>' +
    '<div class="krow" style="top:'+(t+z)+'px;height:'+(h-t-z)+'px;border-bottom:none">' +
      '<span class="kdim">MIDI Ch:</span><span>Omni</span>' +
      '<span style="flex:1"></span><span class="kdim">Memory:</span><span>0.56 GB</span></div>';
}

function applyDrives(el){
  if(!Array.isArray(el.drives)) return;
  for(const d of el.drives){
    if(d.target === '__bg'){                      // das Wallpaper selbst
      /* Der Hintergrund ist eine Ansicht, kein bewegtes Teil: er blaettert
         erst um, wenn der Anschlag steht. Sonst flackerte die ganze Seite
         durch jede Zwischenstufe, und renderStage baute die Buehne bei
         jedem Animationsbild neu auf. */
      if(laufend.has(el.id)) continue;
      const max = Math.max(1, project.bgFrames|0 || 1) - 1;
      let v = el.value|0;
      /* 'map' ordnet einem Knopfwert eine bestimmte Ansicht zu — noetig, sobald
         mehrere Knoepfe denselben Hintergrund auf verschiedene Seiten schalten. */
      if(d.map && Object.prototype.hasOwnProperty.call(d.map, v)) v = d.map[v]|0;
      const neuerWert = Math.min(Math.max(0, v), max);
      if(neuerWert !== project.bgValue){       // ohne echten Wechsel nicht neu zeichnen
        project.bgValue = neuerWert;
        renderStage();
      }
      continue;
    }
    const t = byId(d.target);
    if(!t || t.type!=='image') continue;
    const max = Math.max(1, t.frames|0) - 1;
    /* Quelle und Ziel haben nicht zwingend gleich viele Frames: eine
       Klickflaeche kennt nur auf/zu, die Taste darunter drei Stellungen.
       Ohne Umrechnung bliebe die Taste auf halbem Weg stehen. */
    const emax = Math.max(2, el.frames|0) - 1;   // nie 0: sonst Division durch Null
    const ziel = emax === max ? Math.min(el.value|0, max)
                              : Math.round((el.value|0) / emax * max);
    if(mode==='test' && animDauer(t) > 0 && max >= 2){
      // laeuft ueber die Zwischenstufen; kein applyDrives-Rueckruf, sonst Schleife
      /* Nicht nur den Anzeigeframe vergleichen: waehrend einer Animation
         ist t.value der gerade sichtbare Frame, nicht der Zustand. Sonst
         bliebe beim schnellen Glissando ein alter Anschlag stehen und die
         ueberstrichene Taste liefe unten fest. */
      const a = laufend.get(t.id);
      if((t.value|0) !== ziel || (a && a.ziel !== ziel)){
        laufend.set(t.id, {von: t.value|0, ziel, t0: performance.now(),
                           ms: Math.max(16, animDauer(t)*Math.abs(ziel-(t.value|0))/max)});
        starteTicker();
      }
    }else{
      t.value = ziel;
      updateNode(t);
    }
  }
}

function renderContent(d, el){
  const a = el.asset ? project.assets[el.asset] : null;
  if(el.type==='knob'){
    const v = snapSteps(el.value, el.steps);
    const deg = el.startDeg + v*el.sweep;
    const wantRotate = el.render==='rotate' || (el.render==='auto' && el.frames<=1);
    if(a && !wantRotate){
      applyStrip(d, a, el.frames, el.gridCols, Math.round(v*(el.frames-1)), el.w, el.h);
    }else if(a && wantRotate){
      const r = document.createElement('div'); r.className='rot';
      r.style.backgroundImage='url('+a.dataUrl+')';
      r.style.transform='rotate('+deg+'deg)';
      d.appendChild(r);
    }else{
      const k = document.createElement('div'); k.className='ph-knob';
      const pw = document.createElement('div'); pw.className='pinwrap';
      pw.style.transform='rotate('+deg+'deg)';
      const pin = document.createElement('div'); pin.className='pin';
      pw.appendChild(pin); k.appendChild(pw); d.appendChild(k);
    }
  }
  else if(el.type==='fader'){
    const v = el.value, vert = el.orient!=='h';
    const ha = el.handleAsset ? project.assets[el.handleAsset] : null;
    if(a && el.render!=='handle' && el.frames>1){
      applyStrip(d, a, el.frames, el.gridCols, Math.round(v*(el.frames-1)), el.w, el.h);
    }else{
      if(a){ // Track-Grafik
        const t=document.createElement('div'); t.className='rot';
        t.style.backgroundImage='url('+a.dataUrl+')'; d.appendChild(t);
      }else{
        const t=document.createElement('div'); t.className='ph-track';
        if(vert){ t.style.left='calc(50% - 3px)'; t.style.top='4px'; t.style.bottom='4px'; t.style.width='6px'; }
        else{ t.style.top='calc(50% - 3px)'; t.style.left='4px'; t.style.right='4px'; t.style.height='6px'; }
        d.appendChild(t);
      }
      const hd = document.createElement('div');
      hd.style.position='absolute';
      const hw=el.hw, hh=el.hh;
      if(ha){ hd.style.backgroundImage='url('+ha.dataUrl+')'; hd.style.backgroundSize='100% 100%'; }
      else hd.className='ph-handle';
      hd.style.width=hw+'px'; hd.style.height=hh+'px';
      if(vert){ hd.style.left=((el.w-hw)/2)+'px'; hd.style.top=((1-v)*(el.h-hh))+'px'; }
      else{ hd.style.top=((el.h-hh)/2)+'px'; hd.style.left=(v*(el.w-hw))+'px'; }
      d.appendChild(hd);
    }
  }
  else if(el.type==='button'){
    const frames = Math.max(2, el.frames|0);
    const idx = (el.value|0)%frames;
    if(a) applyStrip(d, a, frames, 1, idx, el.w, el.h);
    else{
      const b=document.createElement('div'); b.className='ph-btn'+(idx>0?' on':'');
      d.appendChild(b);
    }
  }
  else if(el.type==='label'){
    const t=document.createElement('div'); t.className='lbl';
    t.textContent = el.text;
    t.style.fontFamily = el.font||'sans-serif';
    t.style.fontSize = el.size+'px';
    t.style.fontWeight = el.weight;
    t.style.color = el.color;
    t.style.letterSpacing = el.spacing+'px';
    t.style.justifyContent = el.align==='left'?'flex-start':el.align==='right'?'flex-end':'center';
    t.style.textAlign = el.align;
    d.appendChild(t);
  }
  else if(el.type==='image'){
    if(a && (el.frames|0) > 1){
      applyStrip(d, a, el.frames|0, el.gridCols||1, Math.min(el.value|0, (el.frames|0)-1), el.w, el.h);
    }
    else if(a){ const i=document.createElement('div'); i.className='rot'; i.style.backgroundImage='url('+a.dataUrl+')'; d.appendChild(i); }
    else{ const p=document.createElement('div'); p.className='ph-img'; p.textContent='Bild wählen'; d.appendChild(p); }
  }
  else if(el.type==='link'){
    const p=document.createElement('div'); p.className='ph-link';
    p.innerHTML = icon('link') + '<span style="margin-left:6px;">' + esc(el.url||'(keine URL)') + '</span>';
    p.style.cssText = (p.style.cssText||'') + ';display:flex;align-items:center;justify-content:center;';
    d.title = el.url||'';
    d.appendChild(p);
  }
}

/* ============================== Layers & Assets ============================== */
/* Layer-Stack: Reihenfolge = Zeichenreihenfolge (unten = vorn). Elemente
   lassen sich per Drag umsortieren, in Gruppen legen, ausblenden und sperren.
   Gruppen sind reine Ordnung im Editor — der Export bleibt eine flache Liste. */
function groupById(id){ return (project.groups||[]).find(g=>g.id===id) || null; }

function renderLayers(){
  const box = $('#layerList'); box.innerHTML='';
  project.groups = project.groups || [];
  if(!project.elements.length && !project.groups.length){
    box.innerHTML='<div class="empty" style="color:var(--dim);padding:8px;font-size:12px">Noch keine Elemente – oben „+ Knob“ usw. klicken.</div>';
    return;
  }

  /* Von oben nach unten: zuletzt gezeichnetes Element steht oben in der Liste. */
  const order = [...project.elements].reverse();
  const seenGroups = new Set();
  const rows = [];
  for(const el of order){
    const g = el.groupId && groupById(el.groupId);
    if(g && !seenGroups.has(g.id)){
      seenGroups.add(g.id);
      rows.push({ kind:'group', group:g });
    }
    if(g && g.collapsed) continue;
    rows.push({ kind:'el', el, inGroup: !!g });
  }
  /* Leere Gruppen trotzdem zeigen, damit man hineinziehen kann */
  for(const g of project.groups){
    if(!seenGroups.has(g.id)) rows.unshift({ kind:'group', group:g });
  }

  const dropOn = (node, handler) => {
    node.addEventListener('dragover', e=>{ e.preventDefault(); node.style.outline='1px solid var(--acc)'; });
    node.addEventListener('dragleave', ()=>{ node.style.outline=''; });
    node.addEventListener('drop', e=>{
      e.preventDefault(); node.style.outline='';
      const id = e.dataTransfer.getData('text/plain');
      if(id) handler(id);
    });
  };

  for(const r of rows){
    if(r.kind === 'group'){
      const g = r.group;
      const d = document.createElement('div');
      d.className = 'layerItem';
      d.style.cssText = 'background:var(--panel2);font-weight:600;';
      const tw = document.createElement('span');
      tw.innerHTML = icon(g.collapsed ? 'chevRight' : 'chevDown', 12);
      tw.style.cssText = 'cursor:pointer;width:12px;flex:none;color:var(--dim);';
      tw.onclick = e => { e.stopPropagation(); g.collapsed = !g.collapsed; renderLayers(); autosave(); };
      const nm = document.createElement('span');
      nm.textContent = g.name; nm.style.cssText='flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;';
      nm.ondblclick = e => {
        e.stopPropagation();
        const v = prompt('Gruppe umbenennen', g.name);
        if(v){ pushHistory(); g.name = v; renderLayers(); autosave(); }
      };
      const cnt = project.elements.filter(e=>e.groupId===g.id).length;
      const badge = document.createElement('span');
      badge.className='tag'; badge.textContent = cnt;
      const ug = iconBtn('close', 'Gruppe auflösen (Elemente bleiben)');
      ug.onclick = e => {
        e.stopPropagation();
        pushHistory();
        project.elements.forEach(el=>{ if(el.groupId===g.id) el.groupId=null; });
        project.groups = project.groups.filter(x=>x.id!==g.id);
        renderLayers(); autosave();
      };
      d.appendChild(tw); d.appendChild(nm); d.appendChild(badge); d.appendChild(ug);
      dropOn(d, id => {
        const el = byId(id); if(!el) return;
        pushHistory(); el.groupId = g.id; renderLayers(); autosave();
      });
      box.appendChild(d);
      continue;
    }

    const el = r.el;
    const d = document.createElement('div');
    d.className = 'layerItem' + (el.id===sel ? ' sel' : '');
    if(r.inGroup) d.style.paddingLeft = '20px';
    d.draggable = true;
    d.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', el.id));
    dropOn(d, id => {
      if(id === el.id) return;
      const from = project.elements.findIndex(x=>x.id===id);
      const to   = project.elements.findIndex(x=>x.id===el.id);
      if(from < 0 || to < 0) return;
      pushHistory();
      const [m] = project.elements.splice(from,1);
      m.groupId = el.groupId;              // in dieselbe Gruppe wie das Ziel
      project.elements.splice(to, 0, m);
      renderAll(); autosave();
    });

    const tag = document.createElement('span');
    tag.className='tag'; tag.textContent = TYPE_NAMES[el.type];
    const nm = document.createElement('span');
    nm.textContent = el.name;
    nm.style.cssText = 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'
      + (el.hidden ? 'opacity:.45;text-decoration:line-through;' : '');

    const eye = iconBtn(el.hidden ? 'eyeOff' : 'eye', el.hidden ? 'Einblenden' : 'Ausblenden');
    eye.onclick = e => { e.stopPropagation(); pushHistory(); el.hidden = !el.hidden; renderAll(); autosave(); };

    const lk = iconBtn(el.locked ? 'lock' : 'unlock', el.locked ? 'Entsperren' : 'Sperren (nicht verschiebbar)');
    lk.onclick = e => { e.stopPropagation(); pushHistory(); el.locked = !el.locked; renderLayers(); autosave(); };

    d.appendChild(tag); d.appendChild(nm); d.appendChild(eye); d.appendChild(lk);
    d.onclick = ()=>{ sel=el.id; renderStage(); renderLayers(); renderInspector(); };
    box.appendChild(d);
  }
}

const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderAssets(){
  const box = $('#assetList'); box.innerHTML='';
  const ids = Object.keys(project.assets);
  for(const id of ids){
    const a = project.assets[id];
    const d = document.createElement('div');
    d.className = 'assetItem'+(project.bg===id?' isBg':'');
    const img = document.createElement('img'); img.src = a.dataUrl;
    const nm = document.createElement('span'); nm.className='nm'; nm.textContent=a.name; nm.title=a.name+' ('+a.w+'×'+a.h+')';
    const bgBtn = document.createElement('button'); bgBtn.className='mini'; bgBtn.textContent='BG';
    bgBtn.title='Als Hintergrund setzen';
    bgBtn.onclick = ()=>{ pushHistory(); project.bg = (project.bg===id?null:id);
      ausTafelRechnen(true);            // im Kontakt-Modus Groesse mitziehen
      renderStage(); renderAssets(); renderInspector(); syncToolbar(); };
    const del = document.createElement('button'); del.className='mini danger'; del.textContent='✕';
    del.onclick = ()=>{
      pushHistory();
      delete project.assets[id];
      if(project.bg===id) project.bg=null;
      for(const el of project.elements){
        if(el.asset===id) el.asset=null;
        if(el.handleAsset===id) el.handleAsset=null;
      }
      renderAll();
    };
    d.append(img, nm, bgBtn, del);
    box.appendChild(d);
  }

function addImageFiles(files){
  const imgs = [...files].filter(f=>f.type.startsWith('image/'));
  if(!imgs.length) return;
  pushHistory();
  let pending = imgs.length;
  for(const f of imgs){
    const rd = new FileReader();
    rd.onload = ()=>{
      const url = rd.result;
      const im = new Image();
      im.onload = ()=>{
        project.assets['as_'+(assetCounter++)] = {name:f.name, dataUrl:url, w:im.naturalWidth, h:im.naturalHeight};
        if(--pending===0){ renderAssets(); renderInspector(); autosave(); }
      };
      im.src = url;
    };
    rd.readAsDataURL(f);
  }
}

/* ============================== Inspector ============================== */
function row(label, input){
  const r = document.createElement('div'); r.className='row';
  const l = document.createElement('label'); l.textContent=label;
  r.append(l, input); return r;
}
function numIn(el, key, opts={}){
  const i = document.createElement('input'); i.type='number';
  if(opts.min!==undefined) i.min=opts.min;
  if(opts.step!==undefined) i.step=opts.step;
  i.value = el[key];
  i.addEventListener('focus', ()=>pushHistory());
  i.addEventListener('input', ()=>{
    const v = parseFloat(i.value);
    if(!isNaN(v)){ el[key] = v; updateNode(el); }
  });
  return i;
}
function textIn(el, key, cb){
  const i = document.createElement('input'); i.type='text'; i.value = el[key]||'';
  i.addEventListener('focus', ()=>pushHistory());
  i.addEventListener('input', ()=>{ el[key]=i.value; updateNode(el); if(cb)cb(); });
  return i;
}
function selectIn(el, key, options, cb){
  const s = document.createElement('select');
  for(const [val,lab] of options){
    const o=document.createElement('option'); o.value=val; o.textContent=lab; s.appendChild(o);
  }
  s.value = String(el[key]);
  s.addEventListener('change', ()=>{ pushHistory(); el[key]=s.value; updateNode(el); if(cb)cb(); });
  return s;
}
function assetSelect(el, key){
  const s = document.createElement('select');
  const none=document.createElement('option'); none.value=''; none.textContent='(keine Grafik)';
  s.appendChild(none);
  for(const id of Object.keys(project.assets)){
    const o=document.createElement('option'); o.value=id; o.textContent=project.assets[id].name;
    s.appendChild(o);
  }
  s.value = el[key]||'';
  s.addEventListener('change', ()=>{ pushHistory(); el[key]=s.value||null; updateNode(el); });
  return s;
}

/* An eine Ansicht binden: in welchen Hintergrundzustaenden ist das Element da?
   Nichts angehakt = immer sichtbar (Fussleiste). Genau wie in Kontakt, wo je
   Seite ein anderer Satz Bedienelemente gezeichnet wird. */
/* Drei Zahlen muessen zusammenpassen: Tafelhoehe = Kopfzeile + Fensterhoehe.
   Stimmen sie nicht, hat Kontakt unten kein Wallpaper mehr und zeichnet
   Schwarz - der Fehler, der uns einen halben Tag gekostet hat. Deshalb rechnet
   der Baukasten das jetzt selbst nach und sagt es sofort. */
/* Kontakt-Modus: der Baukasten rechnet die Fenstergroesse aus der Tafel, statt
   sie abzufragen. Tafelhoehe = Kopfzeile + Fensterhoehe, und die Tafelhoehe
   steht im Hintergrundbild. Wer eine neue Tafel einsetzt oder die Zahl der
   Ansichten aendert, bekommt die Fenstergroesse sofort mitgezogen - der Stand,
   bei dem Kontakt unten kein Wallpaper mehr hat, ist damit nicht mehr
   erreichbar. */
function tafelZellenhoehe(){
  const bg = project.bg && project.assets[project.bg];
  if(!bg) return null;
  const cols   = Math.max(1, project.bgCols|0 || 1);
  const reihen = Math.ceil(Math.max(1, project.bgFrames|0 || 1) / cols);
  return bg.h / reihen;
}
function ausTafelRechnen(still){
  if(!project.kontakt) return false;
  const zelle = tafelZellenhoehe();
  if(!zelle) return false;
  const neu = Math.max(100, Math.round(zelle - (project.bgTop|0)));
  const bg  = project.bg && project.assets[project.bg];
  const brt = bg ? Math.round(bg.w / Math.max(1, project.bgCols|0 || 1)) : project.win.w;
  if(project.win.h === neu && project.win.w === brt) return false;
  project.win.h = neu;
  if(brt >= 100) project.win.w = brt;
  if(!still){ renderStage(); renderInspector(); syncToolbar(); autosave(); }
  return true;
}

function passtDieTafel(){
  const box = document.createElement('div');
  box.style.cssText='font-size:11px;line-height:1.6;margin:6px 0 2px;';
  const bg = project.bg && project.assets[project.bg];
  if(!bg){ return box; }
  const cols  = Math.max(1, project.bgCols|0 || 1);
  const bgN   = Math.max(1, project.bgFrames|0 || 1);
  const reihen = Math.ceil(bgN / cols);
  /* Nicht jedes Projekt bringt die Bildmasse im Asset mit — gebaute
     Pakete speichern nur Namen und Bilddaten. Dann wird die Hoehe aus
     dem geladenen Bild genommen; sonst stuende hier 'NaN hoch'. */
  let hoehe = bg.h;
  if(!(hoehe > 0)){
    const geladen = alphaBild(project.bg);
    if(geladen && geladen.bereit) hoehe = geladen.h;
  }
  if(!(hoehe > 0)) return box;                 // Bild noch nicht da: nichts melden
  const ist   = hoehe / reihen;                // tatsaechliche Zellenhoehe
  const soll  = (project.win.h|0) + (project.bgTop|0);
  if(Math.abs(ist - soll) < 0.51){
    box.style.color = '#7fb98a';
    box.textContent = '✓ Tafel ' + Math.round(ist) + ' = Kopfzeile ' + (project.bgTop|0) +
                      ' + Fenster ' + (project.win.h|0);
    return box;
  }
  box.style.color = '#e2a33c';
  const fehl = Math.round(soll - ist);
  box.innerHTML = '⚠ Tafel ist ' + Math.round(ist) + ' hoch, Kopfzeile ' + (project.bgTop|0) +
    ' + Fenster ' + (project.win.h|0) + ' ergeben ' + soll + '.<br>' +
    (fehl > 0 ? fehl + ' Zeilen ohne Bild — in Kontakt unten schwarz.'
              : (-fehl) + ' Zeilen zu viel — der Rest wird nie gezeigt.');
  const b = document.createElement('button');
  b.className='mini'; b.style.marginTop='6px';
  b.textContent = 'Fenster auf ' + Math.round(ist - (project.bgTop|0)) + ' setzen';
  b.onclick = ()=>{ pushHistory();
    project.win.h = Math.max(100, Math.round(ist - (project.bgTop|0)));
    renderStage(); renderInspector(); syncToolbar(); autosave(); };
  box.appendChild(b);
  return box;
}

function viewBindPanel(el){
  const wrap = document.createElement('div'); wrap.className='group';
  const bgN = Math.max(1, project.bgFrames|0 || 1);
  const head = document.createElement('div');
  head.style.cssText='font-size:11px;color:var(--dim);margin-bottom:6px;letter-spacing:.04em;';
  head.textContent = 'NUR IN ANSICHT';
  wrap.appendChild(head);
  if(bgN < 2){
    const p = document.createElement('div');
    p.style.cssText='font-size:12px;color:var(--dim);line-height:1.6;';
    p.textContent = 'Der Hintergrund hat nur eine Ansicht — es gibt nichts zu binden.';
    wrap.appendChild(p);
    return wrap;
  }
  el.showOnBg = Array.isArray(el.showOnBg) ? el.showOnBg : [];
  for(let i=0;i<bgN;i++){
    const r = document.createElement('div');
    r.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px;';
    const cb = document.createElement('input');
    cb.type='checkbox'; cb.checked = el.showOnBg.includes(i);
    cb.onchange = ()=>{
      pushHistory();
      el.showOnBg = el.showOnBg.filter(v => v !== i);
      if(cb.checked) el.showOnBg.push(i);
      el.showOnBg.sort((a,b)=>a-b);
      renderStage(); renderInspector(); autosave();
    };
    const lb = document.createElement('span');
    lb.style.cssText='flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
    lb.textContent = (project.bgStates && project.bgStates[i]) || ('Ansicht ' + i);
    r.appendChild(cb); r.appendChild(lb);
    wrap.appendChild(r);
  }
  const hint = document.createElement('div');
  hint.style.cssText='font-size:11px;color:var(--dim);line-height:1.5;margin-top:6px;';
  hint.textContent = 'Nichts angehakt = in jeder Ansicht sichtbar.';
  wrap.appendChild(hint);
  return wrap;
}

    const fr = document.createElement('div'); fr.className='row';

    g2.appendChild(row('Animation ms', numIn(el,'animMs',{min:0,step:10})));
    const animNote = document.createElement('div');
    animNote.style.cssText = 'color:var(--dim);font-size:11px;padding:2px 10px 6px';
    animNote.textContent = '0 = springt sofort. Sonst Zeit für den ganzen Weg durch die Frames, z. B. 70.';
    g2.appendChild(animNote);

    t.addEventListener('focus',()=>pushHistory());
    t.addEventListener('input',()=>{ el.text=t.value; updateNode(el); });
    g2.appendChild(row('Text', t));
    g2.appendChild(row('Schrift', textIn(el,'font')));
    const fs = document.createElement('div'); fs.className='row';
    fs.innerHTML='<label>Größe / Sperrung</label>';
    fs.append(numIn(el,'size',{min:4,step:1}), numIn(el,'spacing',{step:.5}));
    g2.appendChild(fs);
    g2.appendChild(row('Gewicht', selectIn(el,'weight',[['300','Leicht'],['400','Normal'],['500','Medium'],['600','Halbfett'],['700','Fett']])));
    const col = document.createElement('input'); col.type='color'; col.value = el.color;
    col.addEventListener('focus',()=>pushHistory());
    col.addEventListener('input',()=>{ el.color=col.value; updateNode(el); });
    g2.appendChild(row('Farbe', col));
    g2.appendChild(row('Ausrichtung', selectIn(el,'align',[['left','Links'],['center','Mitte'],['right','Rechts']])));
  }
  if(el.type==='link'){
    g2.appendChild(row('URL', textIn(el,'url')));
    const hint=document.createElement('div');
    hint.style.cssText='color:var(--dim);font-size:11px;margin-top:4px';
    hint.textContent='Unsichtbare Klickfläche. Im Testen-Modus öffnet ein Klick die URL im Browser.';
    g2.appendChild(hint);
  }
  if(el.type==='image'){
    g2.appendChild(row('Grafik', assetSelect(el,'asset')));
    const fit = document.createElement('button'); fit.className='mini'; fit.textContent='Originalgröße übernehmen';
    fit.onclick = ()=>{
      const a = el.asset && project.assets[el.asset]; if(!a) return;
      pushHistory();
      /* Bei Sprites die Groesse EINES Frames nehmen, nicht die des ganzen Bogens */
      if(a.sprite && (el.frames|0) > 1){ el.w = a.sprite.fw; el.h = a.sprite.fh; }
      else { el.w=a.w; el.h=a.h; }
      updateNode(el); renderInspector();
    };
    g2.appendChild(fit);
    /* Bild als Sprite: mehrere Zustaende, die ein Button umschalten kann */
    g2.appendChild(row('Zustände', numIn(el,'frames',{min:1,step:1})));
    if((el.frames|0) > 1){
      g2.appendChild(row('Spalten', numIn(el,'gridCols',{min:1,step:1})));
      g2.appendChild(row('Zeigt Frame', numIn(el,'value',{min:0,step:1})));
      g2.appendChild(stateEditor(el));
    }
  }
  // Alpha-Trefferpruefung je Element abschaltbar — bei Fadern soll die ganze
  // Bahn anklickbar bleiben, nicht nur der Griff.
  if(el.asset){
    const gA = document.createElement('div'); gA.className='grp';
    const lab = document.createElement('label'); lab.className='chk';
    const cb = document.createElement('input'); cb.type='checkbox';
    cb.checked = el.alphaHit !== false;
    cb.onchange = ()=>{ pushHistory(); el.alphaHit = cb.checked; };
    lab.append(cb, document.createTextNode(' Treffer nur auf sichtbaren Pixeln'));
    gA.appendChild(lab);
    box.appendChild(gA);
  }

  if(el.type==='knob'||el.type==='fader'){
    const vr = document.createElement('input'); vr.type='range'; vr.min=0; vr.max=1; vr.step=0.001; vr.value=el.value;
    vr.style.flex='1';
    vr.addEventListener('input', ()=>{ el.value=parseFloat(vr.value); updateNode(el); });
    g2.appendChild(row('Wert (Vorschau)', vr));
  }
  box.appendChild(g2);
  box.appendChild(viewBindPanel(el));

  const g3 = document.createElement('div'); g3.className='group btns';
  const mk = (txt,fn,cls='mini')=>{ const b=document.createElement('button'); b.className=cls; b.textContent=txt; b.onclick=fn; return b; };
  g3.append(
    mk('Duplizieren', ()=>duplicateSel()),
    mk('Als Reihe …', rowDuplicate),
    mk('▲ vor', ()=>moveZ(1)),
    mk('▼ zurück', ()=>moveZ(-1)),
    mk('Löschen', deleteSel, 'mini danger')
  );
  box.appendChild(g3);
}

/* ============================== Interaktion ============================== */
/* 'draft' zeigt nur unsere Flaeche, 'kontakt' setzt Kontakts eigene Kopfleiste
   darueber - dieselben 68 px, die im Plugin das Wallpaper verdecken. */
let kview = 'draft';
const stage = $('#stage');
let dragState = null;

/* ---------------------------- Alpha-Trefferpruefung ----------------------
   Ein Klick trifft das oberste Element, dessen Pixel an dieser Stelle
   tatsaechlich deckend ist — nicht das oberste Rechteck.

   Warum das noetig ist: Bei perspektivisch gezeichneten Bauteilen ueberlappen
   sich die Rechtecke stark. Eine weisse Klaviaturtaste ist 67 px breit, der
   Tastenabstand betraegt aber nur 43 — mit reiner Rechteckpruefung landet der
   Klick auf dem Nachbarn. Gemessen: nur 52 % der Klicks trafen die richtige
   Taste, die schlechteste kam auf 9 %.

   Elemente ohne Bild und solche mit alphaHit === false behalten das ganze
   Rechteck als Trefferflaeche — das braucht man bei Fadern, wo die ganze Bahn
   anklickbar bleiben soll, nicht nur der Griff. */
/* Gerenderte Sprites enthalten den Schlagschatten auf die Nachbartaste.
   Bei 0.35 zaehlte dieser Schatten als Trefferflaeche und E griff nach F.
   Gemessen: Tastenkoerper liegt geschlossen ueber 90 %, Schatten darunter. */
const ALPHA_SCHWELLE = 0.9;
const alphaCache = new Map();

function alphaBild(assetId){
  if(alphaCache.has(assetId)) return alphaCache.get(assetId);
  const a = project.assets[assetId];
  if(!a){ alphaCache.set(assetId, null); return null; }
  const eintrag = { bereit:false, ctx:null, w:0, h:0 };
  alphaCache.set(assetId, eintrag);
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const ctx = c.getContext('2d', { willReadFrequently:true });
    ctx.drawImage(img, 0, 0);
    eintrag.ctx = ctx; eintrag.w = c.width; eintrag.h = c.height;
    eintrag.bereit = true;
  };
  img.src = a.dataUrl;
  return eintrag;
}

/* Trefferflaeche eines Elements: die Vereinigung aller Frames, auf einen
   Frame zusammengelegt. Noetig, weil ein Sprite nur zeigt, was sich
   gegenueber dem Hintergrund aendert — die Taste in Ruhe steckt im
   Hintergrundbild, ihr Frame 0 ist leer. Wer nur den gerade sichtbaren
   Frame prueft, kann so eine Taste nie treffen. Beim Drehknopf ergibt
   die Vereinigung sauber die runde Grundflaeche. */
const trefferCache = new Map();

/* Wie viele Frames zeigt die DARSTELLUNG wirklich? Ein Knopf mit
   'Bild rotieren' und ein Fader mit 'Griff auf Bahn' spannen das ganze
   Bild ueber das Element — dann darf die Maske nicht nach frames
   zerschnitten werden. Ein Button zeichnet immer einspaltig. */
function maskenRaster(el){
  const n = Math.max(1, el.frames|0 || 1);
  const cols = Math.max(1, el.gridCols|0 || 1);
  if(el.type === 'knob'){
    const dreht = el.render === 'rotate' || (el.render === 'auto' && (el.frames|0) <= 1);
    return dreht ? [1, 1] : [n, cols];
  }
  if(el.type === 'fader')
    return (el.render !== 'handle' && (el.frames|0) > 1) ? [n, cols] : [1, 1];
  if(el.type === 'button') return [Math.max(2, el.frames|0), 1];
  return [n, cols];
}

/* Schmale Spalte schliessen (Dilatation, dann Erosion). Zwischen den
   beiden Haelften einer Wippe laeuft ein zwei Pixel schmaler Spalt quer
   durch — er ist vom Rand erreichbar, also kein Loch, aber er gehoert
   zum Bedienteil. Radius 2 schliesst Spalte bis vier Pixel; die rund
   zwanzig Pixel breite Aussparung einer weissen Taste bleibt offen. */
function spalteSchliessen(bild, w, h, r){
  const N = w*h;
  let a = new Uint8Array(N);
  for(let i = 0; i < N; i++) a[i] = bild.data[i*4+3]/255 >= ALPHA_SCHWELLE ? 1 : 0;
  const wachsen = (q, an) => {
    const z = new Uint8Array(N);
    for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
      const i = y*w + x;
      let v = q[i];
      if(an){
        if(!v){
          if(x > 0   && q[i-1]) v = 1;
          else if(x < w-1 && q[i+1]) v = 1;
          else if(y > 0   && q[i-w]) v = 1;
          else if(y < h-1 && q[i+w]) v = 1;
        }
      }else{
        if(v){
          if(x === 0 || x === w-1 || y === 0 || y === h-1) v = 1;   // Rand haelt
          else if(!q[i-1] || !q[i+1] || !q[i-w] || !q[i+w]) v = 0;
        }
      }
      z[i] = v;
    }
    return z;
  };
  for(let k = 0; k < r; k++) a = wachsen(a, true);
  for(let k = 0; k < r; k++) a = wachsen(a, false);
  for(let i = 0; i < N; i++) if(a[i] && bild.data[i*4+3]/255 < ALPHA_SCHWELLE) bild.data[i*4+3] = 255;
}

/* Vom Rand her fluten; was unerreicht bleibt, ist ein eingeschlossenes
   Loch und wird deckend gemacht. */
function loecherFuellen(bild, w, h){
  const deckend = i => bild.data[i*4+3]/255 >= ALPHA_SCHWELLE;
  const aussen = new Uint8Array(w*h);
  const stapel = [];
  for(let x = 0; x < w; x++){
    if(!deckend(x)){ aussen[x] = 1; stapel.push(x); }
    const u = (h-1)*w + x;
    if(!deckend(u)){ aussen[u] = 1; stapel.push(u); }
  }
  for(let y = 0; y < h; y++){
    const l = y*w, r = y*w + w - 1;
    if(!deckend(l)){ aussen[l] = 1; stapel.push(l); }
    if(!deckend(r)){ aussen[r] = 1; stapel.push(r); }
  }
  while(stapel.length){
    const i = stapel.pop();
    const x = i % w, y = (i - x) / w;
    if(x > 0   && !aussen[i-1] && !deckend(i-1)){ aussen[i-1] = 1; stapel.push(i-1); }
    if(x < w-1 && !aussen[i+1] && !deckend(i+1)){ aussen[i+1] = 1; stapel.push(i+1); }
    if(y > 0   && !aussen[i-w] && !deckend(i-w)){ aussen[i-w] = 1; stapel.push(i-w); }
    if(y < h-1 && !aussen[i+w] && !deckend(i+w)){ aussen[i+w] = 1; stapel.push(i+w); }
  }
  for(let i = 0; i < w*h; i++){
    if(!aussen[i] && !deckend(i)) bild.data[i*4+3] = 255;
  }
}

function trefferMaske(el){
  const [n, cols] = maskenRaster(el);
  const key = el.asset + '|' + n + '|' + cols;
  if(trefferCache.has(key)) return trefferCache.get(key);
  const b = alphaBild(el.asset);
  if(!b || !b.bereit) return null;               // noch nicht geladen
  const rows = Math.ceil(n / cols);
  const kw = Math.floor(b.w / cols), kh = Math.floor(b.h / rows);
  const c = document.createElement('canvas');
  c.width = kw; c.height = kh;
  const ctx = c.getContext('2d', { willReadFrequently:true });
  const ziel = ctx.createImageData(kw, kh);
  for(let i = 0; i < n; i++){
    const sx = (i % cols) * kw, sy = Math.floor(i / cols) * kh;
    const q = b.ctx.getImageData(sx, sy, kw, kh).data;
    for(let j = 3; j < q.length; j += 4){
      if(q[j] > ziel.data[j]) ziel.data[j] = q[j];
    }
  }
  /* Eingeschlossene Loecher schliessen. Ein Sprite zeigt nur, was sich
     gegenueber dem Hintergrund aendert: bei einer Wippe kippen nur die
     beiden Haelften, ihre Mitte bleibt stehen und bleibt darum
     durchsichtig. Ohne diesen Schritt haette die Trefferflaeche
     ausgerechnet dort ein Loch, wo man hinklickt. Gefuellt wird nur,
     was vom Rand her nicht erreichbar ist — eine Einbuchtung wie die
     Aussparung einer weissen Taste bleibt also offen. */
  spalteSchliessen(ziel, kw, kh, 3);   // gemessen: Wippenspalt ist 6 px
  loecherFuellen(ziel, kw, kh);

  ctx.putImageData(ziel, 0, 0);
  /* Eine Maske, die kaum etwas abdeckt, taugt nicht als Trefferflaeche —
     etwa bei einem Platzhalterbild von wenigen Pixeln. Dann gilt wieder
     das Rechteck, sonst waere das Element ueberhaupt nicht zu treffen. */
  let deckend = 0;
  for(let j = 3; j < ziel.data.length; j += 4){
    if(ziel.data[j]/255 >= ALPHA_SCHWELLE) deckend++;
  }
  const brauchbar = (kw*kh) >= 64 && deckend >= 0.02*kw*kh;
  const m = { ctx, w: kw, h: kh, brauchbar };
  trefferCache.set(key, m);
  return m;
}

/* Beide Caches sind nur ueber die Asset-Kennung verschluesselt. Da jedes
   neu geladene Projekt wieder bei 'as_1' anfaengt, muessen sie leer sein,
   sobald ein anderes Projekt gilt — sonst gelten fremde Masken. */
function maskenCacheLeeren(){ alphaCache.clear(); trefferCache.clear(); }

/* Deckung eines Elements an der Stelle (fx, fy), beide 0..1 im Element. */
function deckungAn(el, fx, fy){
  if(el.alphaHit === false) return 1;
  if(!el.asset) return 1;
  const m = trefferMaske(el);
  if(!m || !m.brauchbar) return 1;       // nicht geladen oder untauglich: Rechteck gilt
  const px = Math.floor(fx * m.w), py = Math.floor(fy * m.h);
  if(px < 0 || py < 0 || px >= m.w || py >= m.h) return 0;
  try {
    return m.ctx.getImageData(px, py, 1, 1).data[3] / 255;
  } catch(e){
    return 1;                            // z. B. getaintetes Canvas
  }
}

/* Das Element unter dem Zeiger, mit Alpha-Pruefung von oben nach unten. */
function trefferUnter(ev){
  const stapel = document.elementsFromPoint(ev.clientX, ev.clientY);
  let ersterRahmen = null, erstesBedienteil = null;
  const bedienbar = e => e.type==='button' || e.type==='knob' ||
                         e.type==='fader'  || e.type==='link' ||
                         (e.type==='image' && (e.frames|0) > 1 && !wirdGetrieben(e.id));
  for(const node of stapel){
    const d = node.closest && node.closest('.el');
    if(!d) continue;
    const el = byId(d.dataset.id);
    if(!el || el.hidden) continue;
    if(!ersterRahmen) ersterRahmen = d;
    if(!erstesBedienteil && bedienbar(el)) erstesBedienteil = d;
    /* Reine Anzeige faengt keinen Klick: die Kontrollleuchte etwa wird
       vom Netzschalter geschaltet, ihr Kasten ist wegen des Lichthofs
       aber gross und vollflaechig deckend — er lag ueber den Wippen und
       verschluckte sie. Im Bearbeiten-Modus bleibt sie auswaehlbar. */
    if(mode !== 'edit' && el.type === 'image' && wirdGetrieben(el.id)) continue;
    const r = d.getBoundingClientRect();
    if(r.width <= 0 || r.height <= 0) continue;
    const fx = (ev.clientX - r.left) / r.width;
    const fy = (ev.clientY - r.top) / r.height;
    if(fx < 0 || fy < 0 || fx > 1 || fy > 1) continue;
    // Im Bearbeiten-Modus gilt das Rechteck: Auswahl und Hover-Umriss
    // muessen mit dem uebereinstimmen, was der Klick trifft.
    if(mode === 'edit' || deckungAn(el, fx, fy) >= ALPHA_SCHWELLE) return d;
  }
  /* Nichts war deckend genug. Im Bearbeiten-Modus gilt dann das oberste
     Rechteck, sonst liesse sich ein durchsichtiges Element nie auswaehlen.
     Im Test greift das oberste BEDIENTEIL — ein Klick in die Fuge zwischen
     zwei Tasten soll etwas ausloesen, und kein Element darf durch die
     Deckungspruefung voellig unerreichbar werden, etwa wenn seine Grafik
     an falscher Stelle sitzt. */
  return mode === 'edit' ? ersterRahmen : erstesBedienteil;
}

stage.addEventListener('pointerdown', ev=>{
  const target = trefferUnter(ev)
              || ((ev.target && ev.target.closest) ? ev.target.closest('.el') : null);
  if(mode==='edit'){
    if(ev.target.classList.contains('rs')){
      const el = selEl(); if(!el || el.locked) return;
      dragState = {kind:'resize', el, sx:ev.clientX, sy:ev.clientY, ow:el.w, oh:el.h, pushed:false, ratio:el.w/el.h};
      startWindowDrag(); ev.preventDefault(); return;
    }
    if(target){
      const el = byId(target.dataset.id);
      if(sel!==el.id){ sel=el.id; renderStage(); renderLayers(); renderInspector(); }
      if(el.locked) return;               // im Layer-Stack gesperrt
      dragState = {kind:'move', el, sx:ev.clientX, sy:ev.clientY, ox:el.x, oy:el.y, pushed:false};
      startWindowDrag(); ev.preventDefault();
    }else if(ev.target===stage){
      sel=null; renderStage(); renderLayers(); renderInspector();
    }
  }else{ // Test-Modus
    if(!target) return;
    let el = byId(target.dataset.id);
    /* Ein Bild mit mehreren Frames laesst sich im Test unmittelbar druecken,
       auch wenn niemand eine Klickflaeche dafuer angelegt hat. Wird es
       bereits von einem anderen Element ueber 'drives' geschaltet, bleibt
       es passiv — sonst schalteten Klickflaeche und Bild gegeneinander. */
    if(el.type==='image' && (el.frames|0) > 1 && !wirdGetrieben(el.id)){
      const n = el.frames|0;
      el = Object.assign(el, {toggle: el.toggle || (n >= 3 ? 'momentary' : 'onoff')});
      const frames = Math.max(2, n);
      if(el.toggle==='momentary'){
        setzeWert(el, frames-1);
        dragState = {kind:'taste', el, gedrueckt:new Set([el.id])};
        startWindowDrag(); ev.preventDefault();
      }else{
        setzeWert(el, zielWert(el)>0 ? 0 : frames-1);
      }
      return;
    }
    if(el.type==='button'){
      const frames = Math.max(2, el.frames|0);
      if(el.toggle==='momentary'){
        // Wie eine echte Taste: gedrueckt, solange die Maus unten ist. Beim
        // Ziehen laeuft ein Glissando ueber die Nachbartasten.
        setzeWert(el, frames-1);
        dragState = {kind:'taste', el, gedrueckt:new Set([el.id])};
        startWindowDrag(); ev.preventDefault();
      }else{
        // 'onoff': erster ↔ letzter Frame (z. B. Registerzug), 'cycle': alle durchschalten
        const v = zielWert(el);
        setzeWert(el, el.toggle==='onoff' ? (v>0 ? 0 : frames-1) : (v+1)%frames);
      }
    }else if(el.type==='link'){
      if(el.url) window.open(el.url, '_blank');
    }else if(el.type==='knob'||el.type==='fader'){
      dragState = {kind:'value', el, sx:ev.clientX, sy:ev.clientY, ov:el.value,
                   bewegt:false};
      startWindowDrag(); ev.preventDefault();
    }
  }
});

function startWindowDrag(){
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd, {once:true});
}
function onDragMove(ev){
  if(!dragState) return;
  const d = dragState, el = d.el;
  if(d.kind==='value' && !d.bewegt &&
     Math.hypot(ev.clientX-d.sx, ev.clientY-d.sy) > 3) d.bewegt = true;
  if(d.kind==='taste'){
    // Glissando: die Taste unter dem Zeiger drueckt, alle anderen gehen hoch.
    const t = trefferUnter(ev);
    const neuEl = t ? byId(t.dataset.id) : null;
    const jetzt = new Set();
    if(neuEl && neuEl.type==='button' && neuEl.toggle==='momentary'){
      jetzt.add(neuEl.id);
      if(!d.gedrueckt.has(neuEl.id)) setzeWert(neuEl, Math.max(2,(neuEl.frames|0))-1);
    }
    for(const id of d.gedrueckt){
      if(jetzt.has(id)) continue;
      const alt = byId(id);
      if(alt) setzeWert(alt, 0);
    }
    d.gedrueckt = jetzt;
    return;
  }
  if(d.kind==='move'){
    if(!d.pushed){ pushHistory(); d.pushed=true; }
    let nx = d.ox + (ev.clientX-d.sx)/zoom;
    let ny = d.oy + (ev.clientY-d.sy)/zoom;
    if(grid.on && !ev.altKey){ nx = Math.round(nx/grid.size)*grid.size; ny = Math.round(ny/grid.size)*grid.size; }
    el.x = Math.round(nx); el.y = Math.round(ny);
    updateNode(el); syncPosInputs(el);
  }
  else if(d.kind==='resize'){
    if(!d.pushed){ pushHistory(); d.pushed=true; }
    let nw = Math.max(4, d.ow + (ev.clientX-d.sx)/zoom);
    let nh = Math.max(4, d.oh + (ev.clientY-d.sy)/zoom);
    if(ev.shiftKey){ nh = nw/d.ratio; }
    if(grid.on && !ev.altKey){ nw = Math.round(nw/grid.size)*grid.size; nh = Math.round(nh/grid.size)*grid.size; }
    el.w = Math.round(nw); el.h = Math.round(Math.max(4,nh));
    updateNode(el); syncPosInputs(el);
  }
  else if(d.kind==='value'){
    const range = ev.shiftKey ? 600 : 150;
    let dv;
    if(el.type==='fader' && el.orient==='h') dv = (ev.clientX-d.sx)/range;
    else dv = (d.sy-ev.clientY)/range;
    el.value = clamp(d.ov+dv, 0, 1);
    updateNode(el);
    const shown = el.type==='knob' ? snapSteps(el.value, el.steps) : el.value;
    $('#selInfo').textContent = el.name+' : '+Math.round(shown*100)+' %';
  }
}
function onDragEnd(){
  /* Ein Knopf mit wenigen Rasten ist am Geraet ein Klickschalter: vox-chord
     hat drei Stellungen, der selector zwei. Ein Klick ohne Ziehen rastet
     deshalb eine Stellung weiter, statt nichts zu tun. Gezogen wird er
     weiterhin wie ein Regler. */
  if(dragState && dragState.kind==='value' && !dragState.bewegt && mode==='test'){
    const el = dragState.el, n = el.steps|0;
    if(el.type==='knob' && n >= 2 && n <= 6){
      const i = Math.round((el.value||0) * (n-1));
      el.value = ((i + 1) % n) / (n - 1);
      updateNode(el); applyDrives(el); renderInspector();
    }
  }
  if(dragState && dragState.kind==='taste'){
    for(const id of dragState.gedrueckt){
      const el = byId(id);
      if(el) setzeWert(el, 0);
    }
    dragState = null;
    window.removeEventListener('pointermove', onDragMove);
    return;
  }
  window.removeEventListener('pointermove', onDragMove);
  if(dragState && dragState.kind!=='value') { renderInspector(); autosave(); }
  dragState = null;
  updateStatus();
}
function syncPosInputs(){ /* Inspector wird am Drag-Ende neu aufgebaut */ }

window.addEventListener('keydown', ev=>{
  const zielKnoten = (ev.target && ev.target.closest) ? ev.target : document.activeElement;
  const inField = zielKnoten && zielKnoten.closest
                ? zielKnoten.closest('input,textarea,select') : null;
  const meta = ev.metaKey||ev.ctrlKey;
  if(meta && ev.key==='z' && !ev.shiftKey){ ev.preventDefault(); undo(); return; }
  if(meta && (ev.key==='y' || (ev.key==='z'&&ev.shiftKey))){ ev.preventDefault(); redo(); return; }
  if(meta && ev.key==='s'){ ev.preventDefault(); saveProject(); return; }
  if(inField) return;
  if(meta && ev.key==='d'){ ev.preventDefault(); duplicateSel(); return; }
  const el = selEl();
  if(!el || mode!=='edit') return;
  if(ev.key==='Backspace'||ev.key==='Delete'){ ev.preventDefault(); deleteSel(); return; }
  const step = ev.shiftKey?10:1;
  let moved=false;
  if(ev.key==='ArrowLeft'){ el.x-=step; moved=true; }
  if(ev.key==='ArrowRight'){ el.x+=step; moved=true; }
  if(ev.key==='ArrowUp'){ el.y-=step; moved=true; }
  if(ev.key==='ArrowDown'){ el.y+=step; moved=true; }
  if(moved){ ev.preventDefault(); updateNode(el); renderInspector(); autosave(); }
});

/* ---------------------------------------------------------------
   Zoom. Beim Stufenwechsel bleibt der Bildpunkt in der Mitte des
   Ausschnitts stehen — sonst springt die Ansicht beim Vergroessern
   weg und man sucht seine Taste wieder. Cmd/Strg + Mausrad zoomt
   stufenlos auf den Zeiger, wie man es von Karten kennt.
   --------------------------------------------------------------- */
function passendZoom(){
  const wrap = $('#stageWrap'), box = $('#stageBox');
  const r = wrap.getBoundingClientRect();
  const w = project.win.w, h = project.win.h;
  if(!w || !h) return 1;
  /* Der Rand um die Buehne kommt aus dem Stil und ist nicht 32 px —
     abgemessen wird er, statt ihn zu raten, sonst passt 'Einpassen' nie. */
  const bs = getComputedStyle(box);
  const randX = (parseFloat(bs.marginLeft)||0) + (parseFloat(bs.marginRight)||0);
  const randY = (parseFloat(bs.marginTop)||0) + (parseFloat(bs.marginBottom)||0);
  return Math.max(0.1, Math.min(4,
    Math.min((r.width - randX - 8)/w, (r.height - randY - 8)/h)));
}

function setzeZoom(neu, ankerX, ankerY){
  const wrap = $('#stageWrap');
  const alt = zoom;
  neu = Math.max(0.1, Math.min(4, neu));
  if(Math.abs(neu-alt) < 1e-6) return;
  const r = wrap.getBoundingClientRect();
  const box = $('#stageBox');
  const bs = getComputedStyle(box);
  // Der Rand von #stageBox skaliert nicht mit; er muss aus der Rechnung heraus,
  // sonst wandert der Punkt unter dem Zeiger beim Zoomen weg.
  const randL = parseFloat(bs.marginLeft)||0, randO = parseFloat(bs.marginTop)||0;
  // Ankerpunkt: der Zeiger, sonst die Mitte des Ausschnitts
  const ax = (ankerX === undefined ? r.width/2  : ankerX - r.left);
  const ay = (ankerY === undefined ? r.height/2 : ankerY - r.top);
  const bildX = (wrap.scrollLeft + ax - randL) / alt;   // Punkt in Buehnenkoordinaten
  const bildY = (wrap.scrollTop  + ay - randO) / alt;
  zoom = neu;
  renderStage();
  wrap.scrollLeft = bildX*neu - ax + randL;
  wrap.scrollTop  = bildY*neu - ay + randO;
  zoomAuswahlAbgleichen();
}

/* Die Auswahlliste zeigt die naechstliegende Stufe. Sie darf nach dem
   Rad-Zoom nicht auf 'Einpassen' stehenbleiben, sonst laesst sich diese
   Stufe nicht mehr auswaehlen — 'change' feuert bei gleichem Wert nicht. */
function zoomAuswahlAbgleichen(){
  const sel = $('#zoomSel');
  if(!sel) return;
  let beste = null, abstand = Infinity;
  for(const o of sel.options){
    const v = parseFloat(o.value);
    if(isNaN(v)) continue;
    const d = Math.abs(v - zoom);
    if(d < abstand){ abstand = d; beste = o.value; }
  }
  if(beste !== null && abstand < 0.01) sel.value = beste;
  else sel.selectedIndex = -1;              // Zwischenstufe: keine Zeile markiert
}

$('#zoomSel').addEventListener('change', ()=>{
  const v = $('#zoomSel').value;
  setzeZoom(v === 'fit' ? passendZoom() : parseFloat(v));
});

$('#stageWrap').addEventListener('wheel', ev=>{
  if(!(ev.metaKey || ev.ctrlKey)) return;           // ohne Zusatztaste bleibt es Scrollen
  ev.preventDefault();
  const schritt = Math.exp(-ev.deltaY * 0.0015);
  setzeZoom(zoom * schritt, ev.clientX, ev.clientY);
}, {passive:false});
