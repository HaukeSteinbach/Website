/* ====================== Team-Speicher (Cloud) ======================
   Projekte liegen serverseitig im privaten Bucket, erreichbar nur fuer
   eingeloggte Team-Mitglieder (uistudio-api). Damit ist ein Projekt an
   jedem Rechner da, an dem sich jemand aus dem Team anmeldet. */
const CLOUD_URL = () => window.STORE_CONFIG.supabaseUrl + '/functions/v1/uistudio-api';

/* Diese Fassung arbeitet im Bereich 'audio' (Ablage `_uistudio-audio/`). Die
   Instruments-Fassung schickt kein scope mit und landet damit weiterhin im
   alten Bereich. Beide Listen bleiben so getrennt — hier stehen die
   Plugin-Oberflaechen, dort die Kontakt-Instrumente. Der Zugang haengt am
   Bereich: siehe SCOPES in supabase/functions/uistudio-api/index.ts. */
const CLOUD_SCOPE = 'audio';
let cloudSlug = null;   // zuletzt verwendeter Projekt-Slug

function cloudNote(t, err){
  const el = document.getElementById('cloudNote');
  if(!el) return;
  el.textContent = t || '';
  el.style.color = err ? '#c96f5a' : '#8a8378';
}

function cloudCall(payload){
  const store = window.SteinbachStore;
  if(!store || !store.configured) return Promise.reject(new Error('Store nicht konfiguriert'));
  return store.getSession().then(s => {
    if(!s) throw new Error('Nicht angemeldet');
    return fetch(CLOUD_URL(), {
      method:'POST',
      headers:{ 'apikey': window.STORE_CONFIG.supabaseAnonKey,
                'Authorization': 'Bearer ' + s.access_token,
                'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ scope: CLOUD_SCOPE }, payload))
    });
  }).then(res => res.json().catch(()=>({})).then(body => {
    if(!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
    return body;
  }));
}

/* Das Ziel ergibt sich IMMER aus dem Projektnamen. Vorher wurde der Slug des
   zuletzt geoeffneten Projekts weiterverwendet — wer eins oeffnete und danach
   ein neues anlegte, ueberschrieb damit das alte. Wuerde ein fremdes Projekt
   ueberschrieben, wird vorher gefragt. */
function cloudSave(){
  const name = project.name || 'Projekt';
  const slug = fileSlug(name);
  if(!slug){ cloudNote('Bitte dem Projekt oben einen Namen geben.', true); return; }
  cloudNote('sichere …');
  const write = () => cloudCall({ action:'save', slug, name, project }).then(r => {
    cloudSlug = r.saved;
    if(!live) liveStart(r.saved);
    const mb = (r.bytes/1048576).toFixed(1);
    cloudNote('gesichert als „' + r.saved + '" · ' + mb + ' MB');
    setTimeout(()=>cloudNote(''), 8000);
  }).catch(e => cloudNote('Fehler: ' + e.message, true));

  if(slug === cloudSlug){ write(); return; }   // dasselbe Projekt wie geladen
  cloudCall({ action:'list' }).then(r => {
    const treffer = (r.projects||[]).some(p => p.slug === slug);
    if(treffer && !confirm('Im Team-Speicher liegt bereits „' + slug + '".\n\nÜberschreiben?')){
      cloudNote('nicht gesichert');
      return;
    }
    write();
  }).catch(() => write());
}

function cloudOpen(){
  cloudNote('lade Liste …');
  cloudCall({ action:'list' }).then(r => {
    cloudNote('');
    const rows = r.projects || [];
    const build = (body) => {
    if(!rows.length){
      body.innerHTML = '<p style="color:#8a8378;">Noch nichts im Team-Speicher. Mit „Sichern" das erste Projekt ablegen.</p>';
    }
    rows.forEach(p => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08);';
      const info = document.createElement('div');
      info.style.cssText = 'flex:1;min-width:0;';
      const when = (p.updated_at || '').slice(0,16).replace('T',' ');
      info.innerHTML = '<div style="color:#e9e4da;">' + p.slug + '</div>' +
        '<div style="font:11px/1.6 ui-monospace,monospace;color:#8a8378;">' +
        when + ' · ' + (p.size/1048576).toFixed(1) + ' MB</div>';
      const open = document.createElement('button');
      open.className = 'mini'; open.textContent = 'Öffnen';
      open.onclick = () => {
        cloudNote('lade ' + p.slug + ' …');
        cloudCall({ action:'load', slug:p.slug }).then(d => {
          const proj = d.project || d;
          if(!proj.win || !proj.elements) throw new Error('Kein Studio-Projekt');
          pushHistory();
          project = proj; sel = null; cloudSlug = p.slug;
          recountIds(); renderAll(); autosave();
          liveStart(p.slug);
          $('#modalBack').classList.remove('open');
          cloudNote('geladen · ' + p.slug);
          setTimeout(()=>cloudNote(''), 6000);
        }).catch(e => cloudNote('Fehler: ' + e.message, true));
      };
      const del = document.createElement('button');
      del.className = 'mini'; del.textContent = 'Löschen';
      del.onclick = () => {
        if(!confirm('„' + p.slug + '" endgültig aus dem Team-Speicher löschen?')) return;
        cloudCall({ action:'delete', slug:p.slug })
          .then(() => { row.remove(); cloudNote('gelöscht · ' + p.slug); })
          .catch(e => cloudNote('Fehler: ' + e.message, true));
      };
      row.appendChild(info); row.appendChild(open); row.appendChild(del);
      body.appendChild(row);
    });
    };
    openModal('Team-Speicher', build);
  }).catch(e => cloudNote('Fehler: ' + e.message, true));
}

/* ====================== Gemeinsam arbeiten ======================
   Zwei Leute an derselben Oberflaeche, in Echtzeit.

   WIE die Aenderungen entstehen: nicht von Hand an dreissig Stellen
   gemeldet, sondern abgeleitet. Der Editor ruft nach jeder Aenderung
   ohnehin autosave() auf; dort wird `project` gegen einen Schatten des
   zuletzt gesendeten Standes verglichen und nur die Differenz verschickt.
   Das ist der einzige Weg, der ohne Umbau jedes einzelnen Aufrufs
   auskommt — und er kann nichts uebersehen, was ein vergessener Aufruf
   uebersehen wuerde.

   WER GEWINNT: der letzte, und zwar JE FELD, nicht je Element. Wer eine
   Frequenz verschiebt, waehrend der andere denselben Knopf umbenennt,
   verliert nichts. Nur wer dasselbe Feld desselben Elements gleichzeitig
   anfasst, ueberschreibt den anderen — dagegen hilft die Anwesenheits-
   anzeige mehr als jede Mechanik.

   GRAFIKEN GEHEN NICHT UEBER DIE LEITUNG. Sie stecken als Base64 im
   Projekt und sind einzeln groesser als eine Realtime-Nachricht sein
   darf. Wer ein Bild hinzufuegt, sichert stattdessen in den Team-Speicher;
   die anderen bekommen einen Hinweis und laden neu. Das ist selten genug,
   um zumutbar zu sein — Layout aendert man staendig, Grafiken einmal. */

let live = null;              // Verbindung, solange ein Projekt offen ist
let liveSchatten = null;      // letzter gesendeter Stand, fuer den Vergleich
let liveAnwendend = false;    // gerade eine fremde Aenderung einspielen?
let liveTakt = null;
let liveRunde = [];           // wer ist sonst noch da
/* Welche Felder von der anderen Seite kamen — "elementId|feld", fuer den
   Kopf "kopf|feld", fuer ganz neue Elemente "elementId|__neu". Rueckgaengig
   laesst genau diese in Ruhe (siehe zurueckMischen). Sobald ich ein solches
   Feld selbst anfasse, gehoert es wieder mir und faellt hier heraus. */
const liveFremdFelder = new Set();
const LIVE_FARBEN = ['#e8c078','#7fd1c1','#e07a9a','#8fb3e8','#c3a5e0','#9dd18a'];

function liveMeineFarbe(){
  /* Aus der Kennung, damit dieselbe Person ueber eine Sitzung hinweg
     dieselbe Farbe behaelt, ohne dass jemand sie vergeben muss. */
  const k = (live && live.kennung) || '';
  let n = 0; for(const c of k) n = (n*31 + c.charCodeAt(0)) >>> 0;
  return LIVE_FARBEN[n % LIVE_FARBEN.length];
}

function liveNote(text, art){
  const el = document.getElementById('liveNote');
  if(!el) return;
  el.textContent = text || '';
  el.style.color = art === 'fehler' ? '#c96f5a' : (art === 'gut' ? '#7fd1c1' : '#8a8378');
}

function liveKlon(o){ return JSON.parse(JSON.stringify(o)); }

/* --- Vergleich: was hat sich seit dem letzten Senden geaendert? --- */
function liveDifferenz(alt, neu){
  const aend = {};

  // Kopf: Name, Fenstergroesse, Hintergrund, Kontakt-Kopfzeile
  const kopf = {};
  ['name','bg','bgTop'].forEach(k => {
    if(JSON.stringify(alt[k]) !== JSON.stringify(neu[k])) kopf[k] = neu[k];
  });
  if(JSON.stringify(alt.win) !== JSON.stringify(neu.win)) kopf.win = neu.win;
  if(Object.keys(kopf).length) aend.kopf = kopf;

  // Elemente und Gruppen: nach Kennung, Feld fuer Feld
  ['elements','groups'].forEach(feld => {
    const altM = new Map((alt[feld]||[]).map(e => [e.id, e]));
    const neuM = new Map((neu[feld]||[]).map(e => [e.id, e]));
    const neuZ = {}, aendZ = {}, weg = [];

    neuM.forEach((e, id) => {
      const a = altM.get(id);
      if(!a){ neuZ[id] = e; return; }
      const teil = {};
      new Set([...Object.keys(a), ...Object.keys(e)]).forEach(k => {
        if(JSON.stringify(a[k]) !== JSON.stringify(e[k])) teil[k] = e[k];
      });
      if(Object.keys(teil).length) aendZ[id] = teil;
    });
    altM.forEach((_, id) => { if(!neuM.has(id)) weg.push(id); });

    /* Die Reihenfolge im Feld ist die Stapelreihenfolge und damit sichtbar.
       Sie wandert als eigene Liste mit, sonst landet ein neu angelegtes
       Element beim anderen immer zuoberst. */
    const reihe = (neu[feld]||[]).map(e => e.id);
    const reiheAlt = (alt[feld]||[]).map(e => e.id);
    const reiheNeu = JSON.stringify(reihe) !== JSON.stringify(reiheAlt);

    if(Object.keys(neuZ).length || Object.keys(aendZ).length || weg.length || reiheNeu){
      aend[feld] = { neu:neuZ, teil:aendZ, weg, reihe: reiheNeu ? reihe : null };
    }
  });

  // Grafiken: nur melden DASS welche dazukamen, nie die Bilder selbst
  const altA = Object.keys(alt.assets||{}), neuA = Object.keys(neu.assets||{});
  if(altA.length !== neuA.length || neuA.some(k => !(k in (alt.assets||{})))){
    aend.grafiken = true;
  }

  return Object.keys(aend).length ? aend : null;
}

/* --- Empfang: dieselbe Aenderung auf dieses Bild anwenden --- */
function liveEinspielen(aend){
  if(!aend) return;
  liveAnwendend = true;
  try{
    if(aend.kopf){
      Object.assign(project, aend.kopf);
      Object.keys(aend.kopf).forEach(k => liveFremdFelder.add('kopf|' + k));
      if('name' in aend.kopf) $('#projName').value = project.name || '';
    }

    ['elements','groups'].forEach(feld => {
      const teil = aend[feld];
      if(!teil) return;
      if(!Array.isArray(project[feld])) project[feld] = [];
      const karte = new Map(project[feld].map(e => [e.id, e]));

      (teil.weg||[]).forEach(id => karte.delete(id));
      Object.entries(teil.neu||{}).forEach(([id,e]) => {
        karte.set(id, e);
        liveFremdFelder.add(id + '|__neu');
      });
      Object.entries(teil.teil||{}).forEach(([id,felder]) => {
        const e = karte.get(id);
        /* Ein Feld-Update auf ein Element, das es hier nicht (mehr) gibt,
           wird verworfen statt als halbes Element angelegt. */
        if(e) Object.assign(e, felder);
        Object.keys(felder).forEach(k => liveFremdFelder.add(id + '|' + k));
      });

      if(teil.reihe){
        const sortiert = teil.reihe.map(id => karte.get(id)).filter(Boolean);
        karte.forEach((e,id) => { if(!teil.reihe.includes(id)) sortiert.push(e); });
        project[feld] = sortiert;
      } else {
        project[feld] = Array.from(karte.values());
      }
    });

    if(aend.grafiken){
      liveNote('Jemand hat Grafiken hinzugefügt — „Projekte" → neu laden.', 'fehler');
    }

    maskenCacheLeeren();
    if(sel && !byId(sel)) sel = null;
    recountIds();
    renderAll();
    liveSchatten = liveKlon(project);   // sonst schicken wir es sofort zurueck
  } finally {
    liveAnwendend = false;
  }
}

/* --- Senden, gebremst: beim Ziehen sonst 60 Nachrichten je Sekunde --- */
function liveAbgleich(){
  if(!live || liveAnwendend || !liveSchatten) return;
  clearTimeout(liveTakt);
  liveTakt = setTimeout(() => {
    const aend = liveDifferenz(liveSchatten, project);
    if(!aend) return;

    /* Was ich anfasse, ist wieder meins — sonst bliebe ein Feld, das der
       andere einmal gesetzt hat, fuer immer vor meinem Rueckgaengig
       geschuetzt. */
    Object.keys(aend.kopf || {}).forEach(k => liveFremdFelder.delete('kopf|' + k));
    ['elements','groups'].forEach(feld => {
      const teil = aend[feld]; if(!teil) return;
      Object.entries(teil.teil || {}).forEach(([id,felder]) => {
        Object.keys(felder).forEach(k => liveFremdFelder.delete(id + '|' + k));
      });
      (teil.weg || []).forEach(id => {
        Array.from(liveFremdFelder).forEach(e => { if(e.startsWith(id + '|')) liveFremdFelder.delete(e); });
      });
    });

    live.senden('aend', aend);
    liveSchatten = liveKlon(project);
  }, 60);
}

/* --- Anwesenheit --- */
function liveRundeZeigen(liste){
  liveRunde = liste || [];
  const el = document.getElementById('livePeers');
  if(!el) return;
  el.innerHTML = '';
  liveRunde.forEach(p => {
    const punkt = document.createElement('span');
    punkt.textContent = (p.name || '?').slice(0,1).toUpperCase();
    punkt.title = (p.name || 'Unbekannt') + (p.sieht ? ' · ' + p.sieht : '');
    punkt.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;' +
      'width:18px;height:18px;border-radius:50%;font:10px/1 ui-monospace,monospace;' +
      'margin-left:4px;color:#111;background:' + (p.farbe || '#8a8378');
    el.appendChild(punkt);
  });
  liveZeigerZeichnen();
}

/* Fremde Zeiger und Auswahlrahmen liegen ueber der Buehne, nicht darin —
   so kann kein fremder Zeiger versehentlich einen Klick abfangen. */
function liveZeigerZeichnen(){
  let schicht = document.getElementById('liveLayer');
  if(!schicht){
    const box = document.getElementById('stage');
    if(!box) return;
    schicht = document.createElement('div');
    schicht.id = 'liveLayer';
    schicht.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden';
    box.appendChild(schicht);
  }
  schicht.innerHTML = '';
  liveRunde.forEach(p => {
    if(typeof p.x !== 'number') return;
    const z = document.createElement('div');

function liveStart(slug){
  liveStop();
  if(!slug || !window.SteinbachLive || !window.SteinbachStore) return;
  const store = window.SteinbachStore;

  liveSchatten = liveKlon(project);
  live = window.SteinbachLive.verbinden({
    raum: slug,
    holeToken: () => store.getSession().then(s => s && s.access_token),
    ich: { name: 'wird geladen …' },
    aufOp: (name, daten) => { if(name === 'aend') liveEinspielen(daten); },
    aufAnwesend: liveRundeZeigen,
    aufZustand: (zustand, text) => {
      if(zustand === 'verbunden'){

      } else {
        liveNote(text || zustand, zustand === 'fehler' ? 'fehler' : null);

     niemand kann sich als der andere ausgeben. */
  store.getSession().then(s => {

    live.michMelden({ name: mail.split('@')[0] || 'jemand', farbe: liveMeineFarbe() });
  });

/* ---------------------------------------------------------------
   Rechnertastatur als Klaviatur, Belegung wie in Ableton Live.
   Gelesen wird ev.code, also die Taste an ihrer Stelle — damit
   spielt sich das auf deutscher wie auf englischer Tastatur gleich.
   Y/X verschiebt die Oktave, C/V die Anschlagstaerke (die merkt
   sich der Editor, gespielt wird sie spaeter vom Plugin).
   --------------------------------------------------------------- */
const TASTATUR = {
  KeyA:0,  KeyW:1,  KeyS:2,  KeyE:3,  KeyD:4,  KeyF:5,  KeyT:6,
  KeyG:7,  KeyY:8,  KeyH:9,  KeyU:10, KeyJ:11,
  KeyK:12, KeyO:13, KeyL:14, KeyP:15, Semicolon:16, Quote:17
};
let oktavVerschiebung = 0;
let anschlag = 100;
const klingend = new Map();          // code -> Element

/* Alle spielbaren Tasten nach MIDI-Note, aus paramId 'note_<n>'. */
function notenTasten(){
  const m = new Map();
  for(const el of project.elements){
    if(!istTaste(el)) continue;
    const t = /(?:^|_)note_?(\d+)/.exec(el.paramId || '');
    if(!t) continue;
    const note = parseInt(t[1], 10);
    // Bei zwei Manualen traegt jede Note zwei Elemente. Das erste gewinnt,
    // damit nicht stillschweigend eines der beiden stumm bleibt.
    if(!m.has(note)) m.set(note, el);
  }
  return m;
}

/* Grundton: das tiefste C, das im Instrument vorkommt, plus Verschiebung. */
function grundNote(noten){
  const alle = Array.from(noten.keys()).sort((a,b)=>a-b);
  if(!alle.length) return 60;
  /* Startlage so, dass die 18 Tasten der Belegung moeglichst weit im
     Instrument liegen: sie beginnt am Grundton und reicht 17 Halbtoene
     nach oben. Die Mitte allein wuerde bei kleinen Instrumenten auf der
     obersten Note landen — dann waere nur eine einzige Taste spielbar. */
  const tief = alle[0], hoch = alle[alle.length-1];
  let basis = Math.round(((tief + hoch)/2 - 8.5) / 12) * 12;
  if(basis + 17 > hoch) basis = Math.floor((hoch - 17)/12)*12;   // oben Platz lassen
  if(basis < tief)      basis = Math.floor(tief/12)*12;          // nie unter das unterste C
  return basis + oktavVerschiebung*12;
}

function tastaturHinweis(text){
  let n = document.getElementById('klavHinweis');
  if(!n){
    n = document.createElement('div');
    n.id = 'klavHinweis';
    n.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);'+
      'background:#1b1b1f;color:#e8e8ea;border:1px solid #3a3a42;border-radius:6px;'+
      'padding:6px 12px;font:12px ui-monospace,monospace;z-index:99999;pointer-events:none;'+
      'opacity:0;transition:opacity .18s';
    document.body.appendChild(n);
  }
  n.textContent = text;
  n.style.opacity = '1';
  clearTimeout(n.__t);
  n.__t = setTimeout(()=>{ n.style.opacity='0'; }, 1400);
}

function tippenErlaubt(ev){
  if(mode !== 'test') return false;
  const a = document.activeElement;
  if(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA' || a.tagName==='SELECT' || a.isContentEditable)) return false;
  return !(ev.metaKey || ev.ctrlKey || ev.altKey);
}

window.addEventListener('keydown', ev => {
  if(!tippenErlaubt(ev)) return;
  const noten = notenTasten();
  if(!noten.size) return;

  if(ev.code === 'KeyZ' || ev.code === 'KeyX'){        // Oktave
    ev.preventDefault();
    if(ev.repeat) return;
    oktavVerschiebung += (ev.code === 'KeyX' ? 1 : -1);
    oktavVerschiebung = Math.max(-4, Math.min(4, oktavVerschiebung));
    tastaturHinweis('Oktave ' + (oktavVerschiebung>=0?'+':'') + oktavVerschiebung +
                    '   (Grundton ' + grundNote(noten) + ')');
    return;
  }
  if(ev.code === 'KeyC' || ev.code === 'KeyV'){        // Anschlagstaerke
    ev.preventDefault();
    if(ev.repeat) return;
    anschlag = Math.max(1, Math.min(127, anschlag + (ev.code==='KeyV' ? 10 : -10)));
    tastaturHinweis('Anschlag ' + anschlag);
    return;
  }

  const halbton = TASTATUR[ev.code];
  if(halbton === undefined) return;
  ev.preventDefault();
  if(ev.repeat || klingend.has(ev.code)) return;       // Wiederholung ist kein neuer Anschlag

  const el = noten.get(grundNote(noten) + halbton);
  if(!el){ tastaturHinweis('keine Taste fuer Note ' + (grundNote(noten)+halbton)); return; }
  klingend.set(ev.code, el);
  setzeWert(el, Math.max(2, el.frames|0) - 1);
});

window.addEventListener('keyup', ev => {
  const el = klingend.get(ev.code);
  if(!el) return;
  klingend.delete(ev.code);
  setzeWert(el, 0);
});

function autoParamId(el){

    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || el.id;
}
function assetName(id){ const a = id && project.assets[id]; return a ? a.name : null; }

function usedAssetIds(){
  const ids = new Set();
  if(project.bg) ids.add(project.bg);
  for(const el of project.elements){
    if(el.asset) ids.add(el.asset);
    if(el.handleAsset) ids.add(el.handleAsset);
  }
  return [...ids].filter(id=>project.assets[id]);

function buildExport(withAssets){
  const W = project.win.w, H = project.win.h;
  const n5 = v => +(v.toFixed(5));
  const bg = project.bg && project.assets[project.bg];
  return {
    format:'steinbach-ui-layout', version:1,
    name: project.name,
    window:{ w:W, h:H },
    background: bg ? { file:bg.name, naturalW:bg.w, naturalH:bg.h,
      frames: Math.max(1, project.bgFrames|0 || 1),
      cols: Math.max(1, project.bgCols|0 || 1),
      stateNames: (project.bgFrames|0) > 1 && Array.isArray(project.bgStates) ? project.bgStates.slice() : undefined,
    } : null,
    assets: withAssets ? usedAssetIds().map(id=>{
      const a = project.assets[id];
      return { file:a.name, w:a.w, h:a.h, dataUrl:a.dataUrl };
    }) : undefined,
    elements: project.elements.map(el=>{
      const cx = el.x+el.w/2, cy = el.y+el.h/2;
      const out = {
        id: el.paramId || autoParamId(el),
        name: el.name,
        type: el.type,
        px:   { left:el.x, top:el.y, w:el.w, h:el.h, cx:+cx.toFixed(1), cy:+cy.toFixed(1) },
        norm: { left:n5(el.x/W), top:n5(el.y/H), w:n5(el.w/W), h:n5(el.h/H), cx:n5(cx/W), cy:n5(cy/H) }
      };
      /* An eine Ansicht gebunden? Leer/fehlend heisst: in jeder Ansicht da. */
      if(Array.isArray(el.showOnBg) && el.showOnBg.length){
        out.views = el.showOnBg.slice();
        out.viewNames = el.showOnBg.map(i =>
          (Array.isArray(project.bgStates) && project.bgStates[i]) || ('Ansicht '+i));
      }
      if(el.type==='knob') out.knob = {
        render:el.render, file:assetName(el.asset), frames:el.frames, gridCols:el.gridCols,
        startDeg:el.startDeg, sweepDeg:el.sweep, steps:el.steps||0, radius:+(Math.min(el.w,el.h)/2).toFixed(1),
        alphaHit: el.alphaHit !== false,
        /* 2 bis 6 Rastungen: am Geraet ein Klickschalter, nicht nur Ziehen */
        klickRastet: (el.steps|0) >= 2 && (el.steps|0) <= 6
      };
      if(el.type==='fader') out.fader = {
        orient:el.orient, render:el.render, file:assetName(el.asset), frames:el.frames, gridCols:el.gridCols,
        handleFile:assetName(el.handleAsset), handleW:el.hw, handleH:el.hh
      };
      if(el.type==='button') out.button = {
        file:assetName(el.asset), states:Math.max(2,el.frames|0), toggle:el.toggle||'cycle',
        stateNames: Array.isArray(el.states) ? el.states.slice() : undefined,
        /* 'momentary' ist eine Taste: unten, solange gedrueckt wird.
           alphaHit: getroffen wird am sichtbaren Bild statt am Rechteck.
           animMs: Zeit fuer den ganzen Weg durch die Frames. */
        alphaHit: el.alphaHit !== false,
        animMs: (el.animMs===undefined || el.animMs===null) ? undefined : (el.animMs|0),
        /* Bilder, die dieser Button mitschaltet (Backdrop-Wechsel) */
        drives: (el.drives||[]).map(d=>{
          if(d.target === '__bg') return 'background';
          const t = byId(d.target); return t ? t.name : null;
        }).filter(Boolean),
        /* Welche Ansicht waehlt welcher Knopfwert? */
        drivesMap: (el.drives||[]).find(d => d.target==='__bg' && d.map)?.map,
      };
      if(el.type==='label') out.label = {
        text:el.text, font:el.font, size:el.size, weight:el.weight, color:el.color,
        letterSpacing:el.spacing, align:el.align
      };
      if(el.type==='image') out.image = {
        file:assetName(el.asset),
        frames: Math.max(1, el.frames|0),
        cols: el.gridCols||1,
        stateNames: (el.frames|0) > 1 && Array.isArray(el.states) ? el.states.slice() : undefined,
        alphaHit: el.alphaHit !== false,
      };
      if(el.type==='link') out.link = { url:el.url||'' };
      return out;
    })
  };
}

function rustConst(s){

function buildRust(){

  const L = [];
  L.push('// GENERIERT von Steinbach UI Studio ('+project.name+') — nicht von Hand editieren');
  L.push('// Anker: Zentrum. _N = normiert 0..1 relativ zum Fenster/Hintergrund.');
  L.push('#![allow(dead_code)]');
  L.push('');
  L.push('pub const WINDOW_W: f32 = '+W.toFixed(1)+';');
  L.push('pub const WINDOW_H: f32 = '+H.toFixed(1)+';');
  L.push('');
  for(const el of project.elements){
    const id = rustConst(el.paramId || autoParamId(el));
    const cx = el.x+el.w/2, cy = el.y+el.h/2;
    L.push('// '+el.name+' ('+TYPE_NAMES[el.type]+')'+(assetName(el.asset)?' — '+assetName(el.asset):''));
    L.push('pub const '+id+': (f32, f32) = ('+cx.toFixed(1)+', '+cy.toFixed(1)+');');
    L.push('pub const '+id+'_N: (f32, f32) = ('+(cx/W).toFixed(5)+', '+(cy/H).toFixed(5)+');');
    L.push('pub const '+id+'_SIZE: (f32, f32) = ('+el.w.toFixed(1)+', '+el.h.toFixed(1)+');');
    if(el.type==='knob'){
      L.push('pub const '+id+'_FRAMES: u32 = '+Math.max(1,el.frames|0)+';'+(el.gridCols>1?' // Grid, '+el.gridCols+' Spalten':''));

    }

}

/* ============================== NI-Kontakt-Export ============================== */
/* Erzeugt ein ZIP mit KSP-Script + Resources/pictures (PNG + NI-Metadaten-txt),
   nach dem Muster der originalen Röver-Kontakt-Library. */

const KONTAKT_MAX_W = 1000, KONTAKT_MAX_H = 750;
/* Kontakt zeichnet das Wallpaper hinter der Instrument-Kopfzeile (~45 px, empirisch
   aus der Röver-Library). Der Export legt diese Zugabe automatisch oben an. */
const KONTAKT_HEADER_PAD = 45;

const CRC_T = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c; }
  return t; })();
function crc32(u8){ let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_T[(c^u8[i])&255]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0; }

/* ZIP ohne Kompression (Store) — reicht, PNGs sind bereits komprimiert. */
function zipStore(files){
  const enc=new TextEncoder(); const parts=[], central=[]; let off=0;
  const DOS_T=0x6000, DOS_D=((2026-1980)<<9)|(8<<5)|17;
  for(const f of files){
    const name=enc.encode(f.name), data=f.data, crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true); lh.setUint16(10,DOS_T,true); lh.setUint16(12,DOS_D,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,DOS_T,true); ch.setUint16(14,DOS_D,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true);
    ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer), name);
    off += 30+name.length+data.length;
  }
  let cd=0; central.forEach(p=>cd+=p.length);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
  eo.setUint32(12,cd,true); eo.setUint32(16,off,true);
  parts.push(...central, new Uint8Array(eo.buffer));
  return new Blob(parts,{type:'application/zip'});
}

function dataUrlBytes(dataUrl){
  const b=atob(dataUrl.split(',')[1]);
  const u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
  return u;
}
const deUmlaut = s => s.replace(/[äöüÄÖÜß]/g, c=>({'ä':'ae','ö':'oe','ü':'ue','Ä':'Ae','Ö':'Oe','Ü':'Ue','ß':'ss'}[c]));
function kspIdent(s){
  s = deUmlaut(s||'').replace(/[^A-Za-z0-9_]/g,'_').replace(/^_+|_+$/g,'');
  if(!/^[A-Za-z]/.test(s)) s = 'c_'+s;
  return s || 'ctrl';
}
function kontaktPicName(assetName){
  return deUmlaut(assetName.replace(/\.[^.]+$/,'')).replace(/[^A-Za-z0-9_-]/g,'_') || 'pic';
}
/* KSP-Dateien reines ASCII halten (wie das Original: "Roever", "Soehne") */
const kspText = s => deUmlaut(String(s||'')).replace(/[^\x20-\x7E]/g,'-');
function kontaktPicTxt(o){
  return 'Has Alpha Channel: '+(o.alpha?'yes':'no')+'\n'
       + 'Number of Animations: '+o.anims+'\n'
       + 'Horizontal Animation: no\n'
       + 'Vertical Resizable: '+(o.rs?'yes':'no')+'\n'
       + 'Horizontal Resizable: '+(o.rs?'yes':'no')+'\n'
       + 'Fixed Top: 0\nFixed Bottom: 0\nFixed Left: 0\nFixed Right: 0\n';
}
function loadImg(dataUrl){
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=dataUrl; });
}
async function padTopPng(dataUrl, pad){
  const img = await loadImg(dataUrl);
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight + pad;
  c.getContext('2d').drawImage(img, 0, pad);
  return c.toDataURL('image/png');
}
function emptyPng(){
  const c=document.createElement('canvas'); c.width=16; c.height=16;
  c.getContext('2d');
  return c.toDataURL('image/png');
}

async function buildKontaktZip(){
  const W=project.win.w, H=project.win.h;
  const slug=fileSlug(project.name);
  const warn=[];
  if(W>KONTAKT_MAX_W) warn.push('Fensterbreite '+W+' px liegt über dem Kontakt-Maximum von '+KONTAKT_MAX_W+' px.');
  if(H>KONTAKT_MAX_H) warn.push('Fensterhöhe '+H+' px liegt über dem Kontakt-Maximum von '+KONTAKT_MAX_H+' px.');

  const pics={};   // picName -> {dataUrl, alpha, anims, rs}
  const usedNames=new Set();
  function regPic(assetId, anims, alpha=true, rs=true){
    const a=project.assets[assetId]; if(!a) return null;
    const name=kontaktPicName(a.name);
    if(pics[name]){ if(anims>pics[name].anims) pics[name].anims=anims; }
    else pics[name]={dataUrl:a.dataUrl, alpha, anims, rs};
    return name;
  }
  function uniqIdent(base){
    let n=base, i=2;
    while(usedNames.has(n)) n=base+'_'+(i++);
    usedNames.add(n); return n;
  }

  const decl=[], layout=[], handlers=[];
  let needEmpty=false;

  for(const el of project.elements){
    const id=uniqIdent(kspIdent(el.paramId||autoParamId(el)));
    const x=Math.round(el.x), y=Math.round(el.y), w=Math.round(el.w), h=Math.round(el.h);
    const D=s=>decl.push(s), P=[];
    const par =(k,v)=>P.push('    set_control_par($'+id+'_Id, '+k+', '+v+')');
    const parS=(k,v)=>P.push('    set_control_par_str($'+id+'_Id, '+k+', "'+v+'")');

    if(el.type==='button'){
      const pic = el.asset ? regPic(el.asset, Math.max(2,el.frames|0)) : null;
      if(el.asset && (el.frames|0)!==6 && (el.frames|0)!==2)
        warn.push('"'+el.name+'": Kontakt-Buttons erwarten 2 oder 6 Frames (NI-Konvention: Aus/Aus-Hover/Aus-Klick/An/An-Hover/An-Klick) — Strip hat '+el.frames+'.');
      if(el.toggle==='cycle' && (el.frames|0)>2)
        warn.push('"'+el.name+'": Kontakt-Buttons schalten nur An/Aus, kein Durchschalten mehrerer Zustände.');
      D('    declare ui_button $'+id);
      D('    set_text($'+id+', "")');
      D('    make_persistent($'+id+')');
      D('    declare $'+id+'_Id');
      D('    $'+id+'_Id := get_ui_id($'+id+')');
      par('$CONTROL_PAR_WIDTH', w); par('$CONTROL_PAR_HEIGHT', h);
      if(pic) parS('$CONTROL_PAR_PICTURE', pic);
      decl.push(...P);
      layout.push('    move_control_px($'+id+', '+x+', '+y+')   { '+kspText(el.name)+' }');
    }
    else if(el.type==='knob'||el.type==='fader'){
      const frames=Math.max(1,el.frames|0);
      const steps = el.type==='knob' && el.steps>=2 ? el.steps : 0;
      const maxV = steps ? steps-1 : 127;
      const pic = el.asset ? regPic(el.asset, frames) : null;
      if(el.asset && (el.gridCols|0)>1)
        warn.push('"'+el.name+'": Kontakt kann nur vertikale Filmstrips (1 Spalte), der Strip hat '+el.gridCols+' Spalten.');
      if(el.type==='knob' && el.render==='rotate')
        warn.push('"'+el.name+'": "Bild rotieren" gibt es in Kontakt nicht — dort ist ein Filmstrip nötig.');
      if(el.type==='fader' && el.render==='handle')
        warn.push('"'+el.name+'": Griff-auf-Bahn-Fader brauchen in Kontakt einen Filmstrip (Bahn+Griff pro Frame).');
      D('    declare ui_slider $'+id+' (0, '+maxV+')');
      D('    make_persistent($'+id+')');
      D('    declare $'+id+'_Id');
      D('    $'+id+'_Id := get_ui_id($'+id+')');
      par('$CONTROL_PAR_WIDTH', w); par('$CONTROL_PAR_HEIGHT', h);
      if(pic) parS('$CONTROL_PAR_PICTURE', pic);
      par('$CONTROL_PAR_MOUSE_BEHAVIOUR', -500);
      decl.push(...P);
      layout.push('    move_control_px($'+id+', '+x+', '+y+')   { '+kspText(el.name)+' }');
    }
    else if(el.type==='label'){
      D('    declare ui_label $'+id+' (1, 1)');
      D('    set_text($'+id+', "'+kspText(el.text).replace(/"/g,"'").replace(/\n/g,' ')+'")');
      D('    declare $'+id+'_Id');
      D('    $'+id+'_Id := get_ui_id($'+id+')');
      par('$CONTROL_PAR_WIDTH', w); par('$CONTROL_PAR_HEIGHT', h);
      par('$CONTROL_PAR_HIDE', '$HIDE_PART_BG');
      decl.push(...P);
      layout.push('    move_control_px($'+id+', '+x+', '+y+')   { '+kspText(el.name)+' }');
      warn.push('"'+el.name+'": Schrift/Farbe von Texten lassen sich in KSP nur begrenzt steuern — im Zweifel Text in den Hintergrund/eine Grafik backen.');
    }
    else if(el.type==='image'){
      const pic = el.asset ? regPic(el.asset, 0) : null;
      D('    declare ui_label $'+id+' (1, 1)');
      D('    set_text($'+id+', "")');
      D('    declare $'+id+'_Id');
      D('    $'+id+'_Id := get_ui_id($'+id+')');
      par('$CONTROL_PAR_WIDTH', w); par('$CONTROL_PAR_HEIGHT', h);
      if(pic) parS('$CONTROL_PAR_PICTURE', pic);
      decl.push(...P);
      layout.push('    move_control_px($'+id+', '+x+', '+y+')   { '+kspText(el.name)+' }');
    }
    else if(el.type==='link'){
      needEmpty=true;
      D('    declare ui_button $'+id);
      D('    set_text($'+id+', "")');
      D('    declare $'+id+'_Id');
      D('    $'+id+'_Id := get_ui_id($'+id+')');
      par('$CONTROL_PAR_WIDTH', w); par('$CONTROL_PAR_HEIGHT', h);
      parS('$CONTROL_PAR_PICTURE', 'Empty');
      decl.push(...P);
      layout.push('    move_control_px($'+id+', '+x+', '+y+')   { '+kspText(el.name)+' }');
      handlers.push(
        'on ui_control($'+id+')',
        '    { KSP kann keine Website oeffnen - Hinweis in der Kontakt-Statuszeile: }',
        '    message("'+kspText(el.url)+'")',
        '    $'+id+' := 0',
        'end on','');
    }
  }

  const bgName = project.bg ? regPic(project.bg, 0, false, false) : null;

  const L=[];
  L.push('{ GENERIERT von Steinbach UI Studio - '+kspText(project.name)+' }');
  L.push('{ Pictures nach Resources/pictures neben die .nki legen. }');
  L.push('');
  L.push('on init');
  L.push('    message("")');
  L.push('    make_perfview');
  L.push('    set_ui_width_px('+Math.min(W,KONTAKT_MAX_W)+')    { Kontakt-Maximum: '+KONTAKT_MAX_W+' px }');
  L.push('    set_ui_height_px('+Math.min(H,KONTAKT_MAX_H)+')   { Kontakt-Maximum: '+KONTAKT_MAX_H+' px }');
  if(bgName){
    L.push('    { Wallpaper: '+KONTAKT_HEADER_PAD+' px Kopfzeilen-Zugabe ist im PNG bereits enthalten }');
    L.push('    set_control_par_str($INST_WALLPAPER_ID, $CONTROL_PAR_PICTURE, "'+bgName+'")');
  }
  L.push('');
  L.push(...decl);
  L.push('');
  L.push('    { ----- LAYOUT ----- }');
  L.push(...layout);
  L.push('end on');
  L.push('');
  if(handlers.length){ L.push(...handlers); }
  L.push('{ ----- Hier eigene Klang-Logik ergaenzen (on note / on ui_control) ----- }');
  const script=L.join('\n');

  const enc=new TextEncoder();
  const files=[];
  files.push({name:slug+'/Script.txt', data:enc.encode(script)});

  const readme=[
    project.name+' — Kontakt-Export aus dem Steinbach UI Studio','',
    'SO KOMMT ES IN KONTAKT:',
    '1. Den Ordner "pictures" nach Resources/pictures deiner Library kopieren',
    '   (neben die .nki, wie bei der originalen Röver-Library).',
    '2. Instrument in Kontakt öffnen → Schraubenschlüssel → Script Editor →',
    '   Inhalt von Script.txt einfügen → Apply.','',
    'KONVENTIONEN:',
    '- Buttons: Filmstrip mit 6 Frames = Aus / Aus-Hover / Aus-Klick / An / An-Hover / An-Klick',
    '  (NI-Standard; 2 Frames = nur Aus/An geht auch).',
    '- Knobs/Fader: vertikaler Filmstrip, Frames laufen mit dem Wert.',
    '- Jede Grafik hat eine .txt mit gleichem Namen (NI-Metadaten) — mitkopieren!',
    '- Wallpaper: oben sind '+KONTAKT_HEADER_PAD+' px Zugabe angefügt, weil Kontakt das',
    '  Wallpaper hinter der Instrument-Kopfzeile beginnt.',
    '- Links: KSP kann keine Website öffnen; der Klick zeigt die URL als message().','',
    warn.length?'HINWEISE:\n'+warn.map(w=>'- '+w).join('\n'):'Keine Hinweise — alles Kontakt-kompatibel.'
  ].join('\n');
  files.push({name:slug+'/LIESMICH.txt', data:enc.encode(readme)});

  for(const [name,p] of Object.entries(pics)){
    let du=p.dataUrl;
    if(name===bgName){
      du = await padTopPng(du, KONTAKT_HEADER_PAD);
    }
    files.push({name:slug+'/Resources/pictures/'+name+'.png', data:dataUrlBytes(du)});
    files.push({name:slug+'/Resources/pictures/'+name+'.txt',
                data:enc.encode(kontaktPicTxt(p))});
  }
  if(needEmpty){
    files.push({name:slug+'/Resources/pictures/Empty.png', data:dataUrlBytes(emptyPng())});
    files.push({name:slug+'/Resources/pictures/Empty.txt',
                data:enc.encode(kontaktPicTxt({alpha:true,anims:0,rs:true}))});
  }
  return {blob:zipStore(files), warn, script};
}

/* --- Zustaende umsortieren/umbenennen (auch nachtraeglich) ------------------
   Beim Umsortieren wird das Sprite aus den gespeicherten Quellframes neu
   gezeichnet, damit Bild und Reihenfolge zusammenpassen. Fehlen die Quellen
   (aeltere Projekte, fremde Strips), werden nur die Namen getauscht und ein
   Hinweis gezeigt. */
function stateEditor(el){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'margin:6px 0 10px;';
  const n = Math.max(1, el.frames|0);
  if(!Array.isArray(el.states) || el.states.length !== n){
    el.states = (el.states||[]).slice(0,n);
    const def = defaultStates(n);
    for(let i=el.states.length;i<n;i++) el.states.push(def[i] || ('State '+i));
  }
  const a = el.asset && project.assets[el.asset];
  const hasSources = !!(a && a.sprite && a.sprite.sources && a.sprite.sources.length === n);

  const head = document.createElement('div');
  head.style.cssText='font-size:11px;color:var(--dim);margin-bottom:4px;';
  head.textContent = 'Reihenfolge der Zustände' + (hasSources ? '' : ' (nur Namen — Sprite stammt nicht aus dem Baukasten)');
  wrap.appendChild(head);

  const move = (from, to) => {
    if(to < 0 || to >= n) return;
    pushHistory();
    const order = Array.from({length:n}, (_,i)=>i);
    order.splice(to, 0, order.splice(from,1)[0]);
    const st = order.map(i=>el.states[i]);
    el.states = st;
    if(hasSources){
      spriteRebuild(el.asset, order).then(()=>{ renderAll(); autosave(); });
    }else{ renderAll(); autosave(); }
  };

  el.states.forEach((name, i) => {
    const r = document.createElement('div');
    r.style.cssText='display:flex;align-items:center;gap:6px;margin-bottom:3px;';
    const num = document.createElement('span');
    num.style.cssText='font:11px ui-monospace,monospace;color:var(--dim);width:16px;flex:none;';
    num.textContent = i;
    const inp = document.createElement('input');
    inp.type='text'; inp.value=name; inp.style.cssText='flex:1;min-width:0;font-size:12px;';
    inp.onchange = ()=>{ pushHistory(); el.states[i]=inp.value; autosave(); };
    const up = iconBtn('up', 'Nach oben'); up.disabled = i===0; up.onclick = ()=>move(i, i-1);
    const dn = iconBtn('down', 'Nach unten'); dn.disabled = i===n-1; dn.onclick = ()=>move(i, i+1);
    const show = iconBtn('eye', 'Diesen Zustand auf der Fläche zeigen');
    show.onclick = ()=>{ el.value = i; renderStage(); autosave(); };
    r.appendChild(num); r.appendChild(inp); r.appendChild(up); r.appendChild(dn); r.appendChild(show);
    wrap.appendChild(r);
  });
  return wrap;
}

/* --- Hintergrund als Sprite -------------------------------------------------
   Bei Orgel und Philicorda ist der wechselnde Teil das Wallpaper selbst. Der
   Bogen enthaelt alle Zustaende untereinander, sichtbar ist immer einer. */
function backdropPanel(){
  const wrap = document.createElement('div');
  wrap.className = 'group';
  wrap.style.cssText = 'margin-top:14px;padding-top:12px;border-top:1px solid var(--line);';
  const h = document.createElement('div');
  h.style.cssText = 'font-size:11px;color:var(--dim);margin-bottom:8px;letter-spacing:.04em;';
  h.textContent = 'HINTERGRUND';
  wrap.appendChild(h);

  if(!project.bg){
    const p = document.createElement('div');
    p.style.cssText='font-size:12px;color:var(--dim);line-height:1.6;';
    p.textContent = 'Noch kein Hintergrundbild. Links bei den Grafiken auf „BG“ klicken.';
    wrap.appendChild(p);
    return wrap;
  }

  const pseudo = {
    get frames(){ return Math.max(1, project.bgFrames|0 || 1); },
    set frames(v){ project.bgFrames = Math.max(1, v|0); ausTafelRechnen(true); },
    get gridCols(){ return Math.max(1, project.bgCols|0 || 1); },
    set gridCols(v){ project.bgCols = Math.max(1, v|0); ausTafelRechnen(true); },
    get value(){ return project.bgValue|0; },
    set value(v){ project.bgValue = v|0; },
    get states(){ return project.bgStates; },
    set states(v){ project.bgStates = v; },
    get top(){ return project.bgTop|0; },
    set top(v){ project.bgTop = Math.max(0, v|0); ausTafelRechnen(true); },
    get asset(){ return project.bg; },
    type:'image',
    id:'__bg',        /* kein echter Knoten -> updateNode zeichnet die Flaeche neu */
  };
  wrap.appendChild(row('Zustände', numIn(pseudo,'frames',{min:1,step:1})));
  wrap.appendChild(row('Kontakt-Kopfzeile', numIn(pseudo,'top',{min:0,step:1})));
  wrap.appendChild(passtDieTafel());
  if(pseudo.frames > 1){
    wrap.appendChild(row('Spalten', numIn(pseudo,'gridCols',{min:1,step:1})));
    wrap.appendChild(row('Zeigt Frame', numIn(pseudo,'value',{min:0,step:1})));
    wrap.appendChild(stateEditor(pseudo));
  }
  const hint = document.createElement('div');
  hint.style.cssText='font-size:11px;color:var(--dim);line-height:1.6;margin-top:6px;';
  hint.textContent = pseudo.frames > 1
    ? 'Ein Button kann den Hintergrund umschalten — im Inspektor des Buttons unter „Schaltet mit“.'
    : 'Enthält der Hintergrund mehrere Zustände untereinander (z. B. Schlüssel gesteckt / gezogen), hier die Anzahl eintragen.';
  wrap.appendChild(hint);
  return wrap;
}

/* --- Button steuert Bilder (Orgelschluessel, Philicorda-Licht) --------------
   Ein Klick schaltet neben dem Button auch ein oder mehrere Bild-Elemente auf
   einen anderen Frame. Im Test-Modus laeuft das live, damit man die ganze
   Mechanik hier schon durchspielen kann. */
function drivesEditor(el){
  const wrap = document.createElement('div');
  wrap.style.cssText='margin:10px 0 4px;padding-top:8px;border-top:1px solid var(--line);';
  const head = document.createElement('div');
  head.style.cssText='font-size:11px;color:var(--dim);margin-bottom:6px;letter-spacing:.04em;';
  head.textContent = 'SCHALTET MIT';
  wrap.appendChild(head);

  el.drives = Array.isArray(el.drives) ? el.drives : [];

  /* Ziele: der Hintergrund selbst (Kontakt-Prinzip) und alle Bild-Elemente. */
  const targets = [];
  if(project.bg){
    targets.push({ id:'__bg', name:'Hintergrund', frames: Math.max(1, project.bgFrames|0 || 1) });
  }
  project.elements.filter(e => e.type==='image' && e.id!==el.id)
    .forEach(t => targets.push({ id:t.id, name:t.name, frames: Math.max(1, t.frames|0) }));

  if(!targets.length){
    const p = document.createElement('div');
    p.style.cssText='font-size:12px;color:var(--dim);line-height:1.6;';
    p.textContent = 'Es gibt noch nichts zum Umschalten: lege oben ein Bild-Element an oder setze links eine Grafik als Hintergrund („BG“).';
    wrap.appendChild(p);
    return wrap;
  }

  targets.forEach(t => {
    const on = el.drives.some(d => d.target === t.id);
    const r = document.createElement('div');
    r.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px;';
    const cb = document.createElement('input');
    cb.type='checkbox'; cb.checked = on;
    cb.onchange = ()=>{
      pushHistory();
      el.drives = el.drives.filter(d => d.target !== t.id);
      if(cb.checked) el.drives.push({ target: t.id });
      renderInspector(); autosave();
    };
    const lb = document.createElement('span');
    lb.style.cssText='flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
    lb.textContent = t.name;
    const badge = document.createElement('span');
    badge.className='tag';
    badge.textContent = t.frames + (t.frames===1 ? ' Frame' : ' Frames');
    if(t.frames < 2) badge.style.color = '#e2a33c';
    r.appendChild(cb); r.appendChild(lb); r.appendChild(badge);
    wrap.appendChild(r);
  });

  const oneFrame = targets.some(t => el.drives.some(d=>d.target===t.id) && t.frames < 2);
  const hint = document.createElement('div');
  hint.style.cssText='font-size:11px;color:' + (oneFrame ? '#e2a33c' : 'var(--dim)') + ';margin-top:6px;line-height:1.5;';
  hint.textContent = oneFrame
    ? 'Ein angehaktes Ziel hat nur einen Frame — dort erst die Zustände eintragen, sonst passiert nichts.'
    : 'Der Zustand des Buttons wird als Frame des Ziels gesetzt. Hat das Ziel weniger Frames, wird der letzte gehalten. Im Modus „Testen“ läuft das live.';
  wrap.appendChild(hint);
  return wrap;
}

/* ============================== Sprite-Baukasten ==============================
   Mehrere Einzelbilder (An/Aus, Hover, Gedrueckt, Zwischenstufen — oder bis zu
   ein paar hundert Frames fuer Knobs und Fader) werden hier zu einem Sprite
   zusammengesetzt. Die Quellbilder bleiben im Asset erhalten, damit sich die
   Reihenfolge spaeter im Editor noch aendern laesst, ohne Qualitaetsverlust. */

let spriteFrames = [];   // [{name, dataUrl, w, h}]

function openSpriteMaker(purpose){
  spriteFrames = [];
  openModal('Sprite bauen', body => {
    body.innerHTML =
      '<p style="color:var(--dim);font-size:12px;margin-bottom:10px;">' +
      (purpose==='motion'
        ? 'Bilder der Bewegung in der richtigen Reihenfolge laden — von Minimum bis Maximum. Für weiche Regler sind 31–128 Frames üblich.'
        : 'Ein Bild je Zustand laden. Frame 0 ist immer der Ruhezustand; Reihenfolge und Namen lassen sich unten ändern und später im Editor erneut anpassen.') +
      '</p>' +
      '<div class="btns" style="margin:0 0 10px;">' +
        '<button class="mini" id="spPick">Bilder wählen …</button>' +
        '<span id="spDrop" style="flex:1;border:1px dashed var(--line);border-radius:6px;padding:6px 10px;color:var(--dim);font-size:12px;">… oder hierher ziehen</span>' +
      '</div>' +
      '<div id="spList" style="max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:6px;"></div>' +
      '<div class="btns" style="margin-top:10px;align-items:center;">' +
        '<label style="font-size:12px;color:var(--dim);">Anordnung' +
          '<select id="spCols" style="margin-left:6px;">' +
            '<option value="1">1 Spalte (Standard, wie Kontakt)</option>' +
            '<option value="auto">Raster (bei vielen Frames)</option>' +
          '</select></label>' +
        '<span style="flex:1"></span>' +
        '<span id="spInfo" style="font-size:12px;color:var(--dim);"></span>' +
      '</div>' +
      '<div class="btns" style="margin-top:10px;">' +
        '<button class="primary mini" id="spBuild">Sprite erstellen</button>' +
        '<button class="mini" id="spBuildAssign">Erstellen und zuweisen</button>' +
      '</div>';

    const pick = document.createElement('input');
    pick.type='file'; pick.accept='image/*'; pick.multiple=true; pick.hidden=true;
    body.appendChild(pick);
    body.querySelector('#spPick').onclick = ()=> pick.click();
    pick.onchange = ()=>{ spriteAdd(pick.files, purpose); pick.value=''; };

    const drop = body.querySelector('#spDrop');
    drop.addEventListener('dragover', e=>{ e.preventDefault(); e.stopPropagation(); drop.style.borderColor='var(--acc)'; });
    drop.addEventListener('dragleave', ()=>{ drop.style.borderColor='var(--line)'; });
    drop.addEventListener('drop', e=>{
      e.preventDefault(); e.stopPropagation(); drop.style.borderColor='var(--line)';
      spriteAdd(e.dataTransfer.files, purpose);
    });

    body.querySelector('#spBuild').onclick = ()=> spriteBuild(purpose, false);
    body.querySelector('#spBuildAssign').onclick = ()=> spriteBuild(purpose, true);
    spriteRenderList(purpose);
  });
}

function spriteAdd(files, purpose){
  const imgs = [...files].filter(f=>f.type.startsWith('image/'))
    .sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true}));
  if(!imgs.length) return;
  let pending = imgs.length;
  for(const f of imgs){
    const rd = new FileReader();
    rd.onload = ()=>{
      const im = new Image();
      im.onload = ()=>{
        spriteFrames.push({ name:f.name.replace(/\.[a-z0-9]+$/i,''), dataUrl:rd.result,
                            w:im.naturalWidth, h:im.naturalHeight });
        if(--pending===0) spriteRenderList(purpose);
      };
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  }
}

function spriteRenderList(purpose){
  const box = document.getElementById('spList');
  if(!box) return;
  box.innerHTML = '';
  if(!spriteFrames.length){
    box.innerHTML = '<div style="padding:12px;color:var(--dim);font-size:12px;">Noch keine Bilder geladen.</div>';
  }
  const names = purpose==='motion' ? null : defaultStates(spriteFrames.length);
  spriteFrames.forEach((fr, i) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:6px 8px;border-bottom:1px solid var(--line);';
    row.draggable = true;
    row.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', String(i)); });
    row.addEventListener('dragover', e=>e.preventDefault());
    row.addEventListener('drop', e=>{
      e.preventDefault();
      const from = parseInt(e.dataTransfer.getData('text/plain'), 10);
      if(isNaN(from) || from===i) return;
      const [m] = spriteFrames.splice(from,1);
      spriteFrames.splice(i,0,m);
      spriteRenderList(purpose);
    });

    const num = document.createElement('span');
    num.style.cssText='font:11px ui-monospace,monospace;color:var(--dim);width:22px;flex:none;';
    num.textContent = i;

    const img = document.createElement('img');
    img.src = fr.dataUrl;
    img.style.cssText='width:40px;height:40px;object-fit:contain;background:#0006;border-radius:4px;flex:none;';

    const nameWrap = document.createElement('div');
    nameWrap.style.cssText='flex:1;min-width:0;';
    if(purpose==='motion'){
      nameWrap.innerHTML = '<div style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'
        + esc(fr.name) + '</div><div style="font:11px ui-monospace,monospace;color:var(--dim);">'
        + fr.w + '×' + fr.h + '</div>';
    }else{
      const inp = document.createElement('input');
      inp.type='text'; inp.value = fr.state || names[i] || ('State '+i);
      inp.style.cssText='width:100%;font-size:12px;';
      inp.oninput = ()=>{ fr.state = inp.value; };
      fr.state = inp.value;
      const dim = document.createElement('div');
      dim.style.cssText='font:11px ui-monospace,monospace;color:var(--dim);margin-top:2px;';
      dim.textContent = fr.w + '×' + fr.h + ' · ' + fr.name;
      nameWrap.appendChild(inp); nameWrap.appendChild(dim);
    }

    const up = iconBtn('up', 'Nach oben'); up.disabled = i===0;
    up.onclick = ()=>{ const [m]=spriteFrames.splice(i,1); spriteFrames.splice(i-1,0,m); spriteRenderList(purpose); };
    const dn = iconBtn('down', 'Nach unten'); dn.disabled = i===spriteFrames.length-1;
    dn.onclick = ()=>{ const [m]=spriteFrames.splice(i,1); spriteFrames.splice(i+1,0,m); spriteRenderList(purpose); };
    const rm = iconBtn('close', 'Frame entfernen');
    rm.onclick = ()=>{ spriteFrames.splice(i,1); spriteRenderList(purpose); };

    row.appendChild(num); row.appendChild(img); row.appendChild(nameWrap);
    row.appendChild(up); row.appendChild(dn); row.appendChild(rm);
    box.appendChild(row);
  });

  const info = document.getElementById('spInfo');
  if(info){
    const n = spriteFrames.length;
    if(!n){ info.textContent=''; }
    else{
      const mism = spriteFrames.some(f=>f.w!==spriteFrames[0].w || f.h!==spriteFrames[0].h);
      info.textContent = n + ' Frames · ' + spriteFrames[0].w + '×' + spriteFrames[0].h
        + (mism ? ' · unterschiedliche Größen werden zentriert' : '');
      info.style.color = mism ? '#e2a33c' : 'var(--dim)';
    }
  }
}

/** Frames zu einem Sprite zeichnen. Liefert {dataUrl, w, h, cols}. */
function spriteCompose(frames, colsMode){
  const fw = Math.max(...frames.map(f=>f.w));
  const fh = Math.max(...frames.map(f=>f.h));
  const n  = frames.length;
  // Raster nur, wenn es sonst zu hoch wird (Browser/GPU moegen keine 30k px).
  let cols = 1;
  if(colsMode === 'auto' && n * fh > 8192) cols = Math.ceil(Math.sqrt(n));
  const rows = Math.ceil(n / cols);
  const cv = document.createElement('canvas');
  cv.width = fw * cols; cv.height = fh * rows;
  const ctx = cv.getContext('2d');
  return Promise.all(frames.map(f => new Promise(res => {
    const im = new Image();
    im.onload = ()=>res(im);
    im.onerror = ()=>res(null);
    im.src = f.dataUrl;
  }))).then(imgs => {
    imgs.forEach((im, i) => {
      if(!im) return;
      const c = i % cols, r = Math.floor(i / cols);
      // Abweichende Groessen mittig in die Zelle setzen statt zu verzerren
      ctx.drawImage(im, c*fw + (fw-im.naturalWidth)/2, r*fh + (fh-im.naturalHeight)/2);
    });
    return { dataUrl: cv.toDataURL('image/png'), w: fw, h: fh, cols };
  });
}

function spriteBuild(purpose, assign){
  if(spriteFrames.length < 2){ alert('Mindestens zwei Bilder laden.'); return; }
  const colsMode = document.getElementById('spCols').value;
  const frames = spriteFrames.map(f=>({ ...f }));
  spriteCompose(frames, colsMode).then(out => {
    pushHistory();
    const id = 'as_'+(assetCounter++);
    const base = (purpose==='motion' ? 'motion' : 'states') + '-' + frames.length;
    project.assets[id] = {
      name: base + '.png',
      dataUrl: out.dataUrl,
      w: out.w * out.cols,
      h: out.h * Math.ceil(frames.length / out.cols),
      /* Quellframes mitspeichern: erlaubt spaeteres Umsortieren ohne Qualitaetsverlust */
      sprite: { count: frames.length, cols: out.cols, fw: out.w, fh: out.h,
                states: (()=>{ const def = purpose==='motion' ? null : defaultStates(frames.length);
                  return frames.map((f,i)=> f.state || (def ? def[i] : 'Frame '+i)); })(),
                sources: frames.map(f=>({ name:f.name, dataUrl:f.dataUrl, w:f.w, h:f.h })) }
    };
    if(assign){
      const el = byId(sel);
      if(el && (el.type==='button' || el.type==='knob' || el.type==='fader' || el.type==='image')){
        el.asset = id;
        el.frames = frames.length;
        el.gridCols = out.cols;
        if(el.type==='button' || el.type==='image'){
          el.states = project.assets[id].sprite.states.slice();
          if(el.type==='button') el.value = 0;
        }
        if(el.type==='image' && (!el.w || !el.h)){ el.w = out.w; el.h = out.h; }
      }else{
        alert('Kein passendes Element ausgewählt — das Sprite liegt jetzt in den Grafiken.');
      }
    }
    $('#modalBack').classList.remove('open');
    renderAll(); autosave();
  });
}

/** Sprite eines Assets aus seinen Quellframes neu bauen (nach Umsortieren). */
function spriteRebuild(assetId, order){
  const a = project.assets[assetId];
  if(!a || !a.sprite || !a.sprite.sources) return Promise.resolve(false);
  const src = order.map(i => a.sprite.sources[i]);
  const states = order.map(i => a.sprite.states[i]);
  return spriteCompose(src, a.sprite.cols > 1 ? 'auto' : '1').then(out => {
    a.dataUrl = out.dataUrl;
    a.w = out.w * out.cols;
    a.h = out.h * Math.ceil(src.length / out.cols);
    a.sprite = { count: src.length, cols: out.cols, fw: out.w, fh: out.h, states, sources: src };
    return true;
  });
}

function openExport(){
  const json = JSON.stringify(buildExport(false), null, 2);
  const rust = buildRust();
  openModal('Export für Hauke', body=>{
    const p = document.createElement('p');
    p.innerHTML = '<b>Komplett-Paket</b> ist der einfachste Weg: eine einzige Datei mit Layout <i>und</i> allen verwendeten Grafiken – mehr braucht Hauke nicht. Alternativ nur die Layout-Daten (dann Grafiken separat als PNG mitschicken).';
    const ta = document.createElement('textarea'); ta.value = json; ta.readOnly = true;
    const btns = document.createElement('div'); btns.className='btns';
    const mk=(t,f,cls='')=>{const x=document.createElement('button'); x.textContent=t; x.className=cls; x.onclick=f; return x;};
    let showing='json';
    const toggle = mk('Rust-Konstanten anzeigen', ()=>{
      showing = showing==='json'?'rust':'json';
      ta.value = showing==='json'?json:rust;
      toggle.textContent = showing==='json'?'Rust-Konstanten anzeigen':'JSON anzeigen';
    });
    btns.append(
      mk('Komplett-Paket (inkl. Grafiken)', ()=>download(fileSlug(project.name)+'.uipaket.json',
        JSON.stringify(buildExport(true), null, 1)), 'primary'),
      mk('NI-Kontakt-Paket (ZIP)', async ev=>{
        const b=ev.target; b.disabled=true; b.textContent='Erzeuge ZIP …';
        try{
          const {blob,warn}=await buildKontaktZip();
          downloadBlob(fileSlug(project.name)+'_kontakt.zip', blob);
          if(warn.length) alert('Kontakt-Export mit Hinweisen (stehen auch in der LIESMICH.txt):\n\n– '+warn.join('\n– '));
        }catch(e){ alert('Kontakt-Export fehlgeschlagen: '+e.message); }
        b.disabled=false; b.textContent='NI-Kontakt-Paket (ZIP)';
      }, 'primary'),
      mk('Nur Layout-JSON', ()=>download(fileSlug(project.name)+'.layout.json', json)),
      mk('geometry.rs herunterladen', ()=>download('geometry_'+fileSlug(project.name).replace(/-/g,'_')+'.rs', rust, 'text/plain')),
      mk('In Zwischenablage', ()=>{ ta.select(); document.execCommand('copy'); }),
      toggle
    );
    body.append(p, ta, btns);
  });
}

function openHelp(){
  openModal('Hilfe', body=>{
    body.innerHTML = `
<p><b>Du bestimmst das Design.</b> Dieses Tool zeigt deine Grafiken in exakter Plugin-Größe und macht sie sofort bedienbar – so siehst du, wie sich dein Entwurf im fertigen Plugin anfühlt.</p>
<h4>Typischer Ablauf</h4>
<ul>
<li>Preset <b>„NI Kontakt — Größe aus der Tafel rechnen“</b> wählen. Danach
bestimmt die Tafel die Fenstergröße, nicht umgekehrt: neue Tafel einsetzen,
Ansichtszahl oder Kopfzeile ändern – die Fenstergröße zieht jedes Mal mit. In der
Werkzeugleiste steht die Rechnung dauerhaft: <b>Tafel 636 = 68 + 568</b>, grün wenn
sie aufgeht. Die festen Presets darunter tun dasselbe für bekannte Tafelhöhen. Kontakt legt oben eine <b>68 px hohe eigene Leiste</b> über das Bild:
<b>Tafelhöhe = 68 + Fensterhöhe</b>. Jakobs Tafel ist 636 hoch, das Fenster also 568.
Stimmt das nicht, sagt es der Baukasten im Hintergrund-Feld und bietet die passende
Höhe zum Anklicken an – sonst hat Kontakt unten kein Wallpaper und zeichnet Schwarz.</li>
<li>Oben rechts neben der Fenstergröße lässt sich zwischen <b>Entwurf</b> und
<b>Kontakt</b> umschalten: Entwurf zeigt die verdeckten Zeilen schraffiert,
Kontakt setzt die echte Kopfleiste darüber – so sieht man den Entwurf so, wie er

<li><b>NI-Kontakt-Paket</b>: ZIP mit fertigem KSP-Script und Resources/pictures (PNG + NI-Metadaten) – direkt in Kontakt einsetzbar. Buttons brauchen 6-Frame-Strips (Aus/Aus-Hover/Aus-Klick/An/An-Hover/An-Klick), Knobs vertikale Strips.</li>
<li><b>Röver-Vorlage</b> (Toolbar): lädt die komplette Röver-Orgel als Ausgangspunkt – Fenster 1000×568 im Kontakt-Raster, alle 17 Registerzüge, Website-Link auf dem „Steinbach“-Schriftzug.</li>
<li><b>+ Link</b>: unsichtbare Klickfläche, die im Testen-Modus (und im fertigen Plugin) eine Website öffnet.</li>
</ul>
<h4>Knobs &amp; Filmstrips</h4>
<ul>
<li><b>Filmstrip</b>: ein Bild mit allen Drehstellungen untereinander (oder als Raster – dann „Spalten“ setzen). „Frames“ = Anzahl Stellungen.</li>
<li><b>Bild rotieren</b>: ein einzelnes Knopf-Bild (Zeiger nach oben zeichnen), das Tool dreht es. Standard-Drehweg: −135° bis +135°.</li>
<li><b>Rastung</b>: z. B. 6 für einen Schalter mit 6 festen Positionen.</li>
</ul>
<h4>Klaviatur spielen (Modus Testen)</h4>
<ul>
<li><b>Mit der Maus</b>: Taste gedrückt halten – sie bleibt unten, solange die Maus unten ist. Beim Ziehen über die Klaviatur läuft ein Glissando.</li>
<li><b>Mit der Rechnertastatur</b>, Belegung wie in Ableton Live:<br>
<kbd>A</kbd><kbd>W</kbd><kbd>S</kbd><kbd>E</kbd><kbd>D</kbd><kbd>F</kbd><kbd>T</kbd><kbd>G</kbd><kbd>Y</kbd><kbd>H</kbd><kbd>U</kbd><kbd>J</kbd><kbd>K</kbd><kbd>O</kbd><kbd>L</kbd><kbd>P</kbd> ab dem Grundton aufwärts.
