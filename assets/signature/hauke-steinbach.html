  E-Mail-Signatur — Hauke Steinbach

  Einsetzen: diese Datei im Browser öffnen, alles markieren (Cmd+A), kopieren
  (Cmd+C) und im Mailprogramm als Signatur einfügen. Nicht den Quelltext
  kopieren, sondern die dargestellte Seite.

  Warum das hier so aussieht, wie es aussieht:

  Tabellen und Stile direkt am Element, weil Outlook alles andere verwirft.
  Keine Webfonts — Archivo Black, Poppins und JetBrains Mono lädt kein
  Mailprogramm nach, also stehen hier Stapel aus Schriften, die auf jedem
  Rechner liegen. Die Anmutung trägt stattdessen die Anordnung: schwere
  Versalien, der Akzentstrich, die technischen Zeilen in Monospace.

  Kein schwarzer Grund, obwohl die Website schwarz ist. Eine Signatur steht am
  Ende einer fremden Nachricht, oft in einem Verlauf mit weißem Hintergrund;
  ein Block in Vollschwarz kämpft dort gegen alles darüber. Dieselbe
  Überlegung wie bei der Rechnung, die aus demselben Grund weiß ist.

  Die Farben sind so gewählt, dass sie auf hellem und auf dunklem Grund
  lesbar bleiben. Ein dunkles Grau für den Namen wäre auf Weiß richtig und im
  Dunkelmodus unsichtbar, und es gibt kein Grau, das auf beidem kräftig wirkt.
  Deshalb trägt der Name die Akzentfarbe und die übrigen Zeilen ein mittleres
  Grau, das nach beiden Seiten genug Abstand hat.

  Das Foto wird von der eigenen Domain geladen und nicht in die Mail
  eingebettet. Eingebettet wäre bequemer — es wäre sofort da, ohne dass etwas
  ausgerollt sein muss —, aber Gmail zeigt Bilder aus data:-URIs grundsätzlich
  nicht an, und der Empfänger sieht dann einen leeren Rahmen. Eine echte
  Adresse zeigen alle.

  Es zeigt bewusst auf hauke-portrait-square.jpg, weil das bereits ausgeliefert
  wird. Unter assets/images/signature-hauke.jpg liegt dieselbe Aufnahme auf
  320 px verkleinert, 23 statt 129 kB; sobald der Server den neuen Stand hat,
  kann die Zeile darauf zeigen. Vorher wäre die Signatur bilderlos, und das
  ist der schlechtere Zustand.

  Die Website zeigt Fotos schwarzweiß, aber das macht sie mit einem
  CSS-Filter, und der wirkt in Mailprogrammen nicht.
-->
